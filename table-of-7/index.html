<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table of 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table of 7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app shell (max 480px) — sticky header, scrolling view, fixed tab bar. Evening dining room: bottle green, brass, wine. */
:root{
  --bg:#0f1c18; --surface:#15261f; --surface-2:#1c3129; --line:rgba(222,200,150,.16);
  --ink:#efe9dc; --muted:#a3b0a6; --brass:#cfab6c; --brass-ink:#1a160c; --wine:#9a3343; --wine-soft:rgba(154,51,67,.18);
  --good:#86c596; --warn:#e3b45c; --bad:#e58474; --scrim:rgba(5,10,8,.62); --card-shadow:0 10px 30px rgba(0,0,0,.28);
  --paper:#f6f1e6; --paper-ink:#2a1f14; --paper-line:#c9b083;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
a{color:var(--brass)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:.005em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#1d3a30 0%,#0b1512 70%);color:#efe9dc;display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));transition:opacity .7s ease}
#splash.out{opacity:0;pointer-events:none}
.mark{position:relative;width:min(220px,58vw);aspect-ratio:1;max-width:100%;margin:0 auto 28px}
.mark svg{width:100%;height:100%;overflow:visible}
.mark .ring{stroke:#cfab6c;stroke-width:1.2;fill:none;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
.mark .seat{fill:#cfab6c;opacity:0;animation:pop .5s forwards}
.mark .five{font-family:var(--f-display);font-style:italic;fill:#efe9dc;font-size:78px;opacity:0;animation:fade .9s 1.2s forwards}
.splash-title{font-family:var(--f-display);font-size:clamp(34px,10vw,48px);letter-spacing:.06em;opacity:0;animation:rise .9s 1.4s forwards}
.splash-tag{margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#cfab6c;opacity:0;animation:fade .9s 1.9s forwards}
.splash-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;color:rgba(239,233,220,.5);opacity:0;animation:fade .6s 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Seat picker / greeting ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gate-inner{width:100%;max-width:420px;display:grid;gap:18px;justify-items:center}
.round{position:relative;width:min(300px,82vw);aspect-ratio:1;max-width:100%}
.round .tabletop{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--surface-2),var(--surface));border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--brass);font-size:42px}
.round .chair{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid transparent;color:#fff;font-weight:600;font-size:20px;display:grid;place-items:center;box-shadow:var(--card-shadow);transition:transform .2s}
.round .chair:hover{transform:scale(1.07)}
.round .chair span{position:absolute;top:100%;margin-top:4px;font-size:12px;color:var(--ink);font-weight:500;white-space:nowrap}
.greet{font-family:var(--f-display);font-size:clamp(30px,8vw,40px)}
.greet em{color:var(--brass)}
#gate.greeting .gate-inner{animation:rise .7s both}

/* ---------- App shell ---------- */
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;flex:1}
.brand i{color:var(--brass)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:11px}
.avatar.xs{width:20px;height:20px;font-size:10px}
.stack{display:inline-flex}
.stack .avatar{border:2px solid var(--surface);margin-left:-6px}
.stack .avatar:first-child{margin-left:0}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;align-content:start}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brass)}
nav.tabs .plan-btn span.disc{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;box-shadow:var(--card-shadow)}
.badge-dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--wine);color:#fff;font-size:10px;line-height:16px;font-weight:700}

/* ---------- Sections & cards ---------- */
.sec{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:22px}
.link-btn{background:none;border:0;color:var(--brass);font-weight:600;font-size:13px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.hello h1{font-size:32px;line-height:1.1}
.hello h1 em{color:var(--brass)}
.hello p{margin:6px 0 0;color:var(--muted)}
.feature{position:relative;overflow:hidden;border-radius:18px;padding:20px;background:linear-gradient(150deg,var(--wine) 0%,color-mix(in srgb,var(--wine) 55%,var(--bg)) 100%);color:#fbeff0;display:grid;gap:8px;box-shadow:var(--card-shadow)}
.feature .eyebrow{color:#f4d9a8}
.feature h3{font-size:28px;line-height:1.1}
.feature .meta{font-size:13px;opacity:.85}
.feature .why{font-size:13px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.feature .actions .btn{background:#fbeff0;color:#5a1622;border-color:transparent}
.feature .actions .btn.ghost{background:transparent;color:#fbeff0;border-color:rgba(251,239,240,.4)}
.feature .plate{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(244,217,168,.35);box-shadow:inset 0 0 0 14px rgba(244,217,168,.06)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.alt b{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.wine{background:var(--wine);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.brass{color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent)}
.pill.wine{color:#fff;background:var(--wine)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.todo .ic{width:34px;height:34px;border-radius:50%;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;flex:none}
:root .todo .ic{color:var(--bad)}
.todo b{display:block;font-weight:600}
.todo small{color:var(--muted)}
.todo .chev{margin-left:auto;color:var(--muted)}
.scroller{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-2px}
.scroller > *{scroll-snap-align:start;flex:0 0 72%}

/* ---------- Restaurant rows ---------- */
.r-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.r-row h3{font-size:18px;line-height:1.2}
.r-row .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.r-row .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.r-row .score{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--brass)}
.stars{color:var(--brass);letter-spacing:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:transparent;color:var(--brass-ink)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}

/* ---------- Events ---------- */
.event{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.event .ev-head{padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.event .ev-head .who{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.event .ev-head .who b{color:var(--ink);font-weight:600}
.event .ev-body{padding:12px 16px 16px;display:grid;gap:14px}
.event h3{font-size:22px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%;position:relative;overflow:hidden}
.opt.mine{border-color:var(--brass)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--brass) 12%,transparent);z-index:0;transition:width .4s}
.opt > *:not(.bar){position:relative;z-index:1}
.opt b{font-family:var(--f-display);font-weight:500;font-size:17px}
.opt .count{font-family:var(--f-mono);font-size:13px}
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;flex-wrap:wrap}
.strip .grow{flex:1;min-width:150px}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px}
.rsvp button[aria-pressed="true"].yes{background:var(--good);color:#0d1f14;border-color:transparent}
.rsvp button[aria-pressed="true"].maybe{background:var(--warn);color:#241a05;border-color:transparent}
.rsvp button[aria-pressed="true"].no{background:var(--bad);color:#2a0d08;border-color:transparent}
.guest{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guest .grow{flex:1;min-width:120px}
.hands{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.hands[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.divider{height:1px;background:var(--line)}

/* ---------- Invitation (deliberately paper, both themes) ---------- */
.invite{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:26px 22px;text-align:center;position:relative;box-shadow:var(--card-shadow);display:grid;gap:10px}
.invite::before{content:"";position:absolute;inset:8px;border:1px solid var(--paper-line);border-radius:3px;pointer-events:none}
.invite .i-eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#8a6a2c;font-weight:600}
.invite .i-title{font-family:var(--f-display);font-style:italic;font-size:30px;line-height:1.1}
.invite .i-rest{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.invite .i-orn{color:#8a6a2c;font-size:14px;letter-spacing:.6em}
.invite .i-meta{font-size:13.5px;line-height:1.6}
.invite .i-meta b{font-weight:600}
.invite .i-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.invite .i-links a{font-size:12.5px;font-weight:600;color:#5a1622;border:1px solid #c9b083;border-radius:999px;padding:6px 12px;text-decoration:none}
.invite .i-note{font-family:var(--f-display);font-style:italic;font-size:15px;color:#5b4a36}

/* ---------- Sheet ---------- */
#sheet-wrap{position:fixed;inset:0;z-index:85;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;gap:16px;align-content:start}
#sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:26px;flex:1;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.review{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--surface)}
.review .top{display:flex;align-items:center;gap:8px;font-size:13px}
.review p{margin:0;font-size:14px}
.crit{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.dots button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.calc-out{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--surface);font-size:14px}
.calc-out .line{display:flex;justify-content:space-between;gap:12px}
.calc-out .total{font-size:18px;font-weight:700;border-top:1px dashed var(--line);padding-top:8px}
.calc-out .pp{font-family:var(--f-display);font-size:28px;color:var(--brass);text-align:center}
.wine{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--wine-soft);border:1px solid color-mix(in srgb,var(--wine) 30%,transparent)}
.wine b{font-family:var(--f-display);font-weight:500;font-size:17px}
.tip{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.tip .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-style:italic}
.tip p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tip b{font-weight:600}
.ledger-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger-row:last-child{border-bottom:0}
.fav{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fav:last-child{border-bottom:0}
.fav .rank{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--brass);text-align:center}
.fav b{font-family:var(--f-display);font-weight:500;font-size:17px;display:block;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border-radius:12px;background:var(--surface)}
.note p{margin:2px 0 0;font-size:14px}
.empty{text-align:center;padding:26px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.pick-list{display:grid;gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--surface))}
.pick .grow{flex:1;min-width:0}
.pick b{font-weight:600;display:block}
.pick small{color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.pick[aria-pressed="true"] .check{background:var(--brass);border-color:transparent;color:var(--brass-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:95;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px}

/* ---------- Live vote & welcome (full screen) ---------- */
#live,#reveal{position:fixed;inset:0;z-index:70;overflow-y:auto;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
#reveal{background:radial-gradient(130% 60% at 50% 0%,color-mix(in srgb,var(--wine) 40%,var(--bg)) 0%,var(--bg) 65%)}
.ov-inner{max-width:480px;margin:0 auto;display:grid;gap:18px}
.ov-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.live-head{text-align:center;display:grid;gap:6px;justify-items:center}
.cd{font-family:var(--f-display);font-size:68px;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
.cd.low{color:var(--bad)}
.ballot{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:grid;gap:10px}
.ballot.mine{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.ballot h3{font-size:24px;line-height:1.15}
.ballot .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ballot .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ballot .bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
.rv-hero{text-align:center;display:grid;gap:8px;justify-items:center;padding-top:6px;animation:rise .8s both}
.rv-hero h1{font-size:clamp(28px,8vw,38px);font-style:italic}
.rv-name{font-family:var(--f-display);font-size:clamp(32px,9.5vw,46px);line-height:1.05;color:var(--brass);text-wrap:balance}
.sup{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
.sup .ic{color:var(--brass);text-align:center}
.arr,.person{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

/* 90-day rotation: a restaurant chosen within 90 days of the target Sunday is resting. */
const ROTATION = 90;
function rotationState(rid, target){
  const lv = lastVisit(rid); if(!lv) return {state:"untried"};
  const gap = daysBetween(lv, target);
  if(gap < ROTATION) return {state:"resting", back: iso(add(parse(lv), ROTATION))};
  if(gap < ROTATION + 30) return {state:"returning"};
  return {state:"eligible"};
}
function sundayPicks(target){
  const t = iso(target);
  const wk = Math.floor(target.getTime() / (7*DAY));
  const pool = R.filter(r => r.city === "Memphis").map(r => {
    const rs = rotationState(r.id, t);
    if(rs.state === "resting" || !meals(r).dinner) return null;
    const a = avgOf(r.id);
    let s = (a ?? 3.6);
    if(rs.state === "untried") s += .9;
    if(rs.state === "returning") s += 1.2;
    if(r.flags.includes("new")) s += .6;
    s += ((wk * 7919 + r.id.length * 104729 + r.name.charCodeAt(2)) % 97) / 97 * 1.4; // weekly shuffle
    return {r, s, rs};
  }).filter(Boolean).sort((a,b) => b.s - a.s);
  return pool.slice(0,3);
}

function miniEvent(e){

/* ---------- Explore ---------- */
function vExplore(){
  const u = st.ui; const t = iso(nextSunday);
  let list = R.filter(r => r.city === u.city);
  if(u.cuisine !== "All") list = list.filter(r => r.cuisine.includes(u.cuisine));
  if(u.filter === "untried") list = list.filter(r => !lastVisit(r.id));
  if(u.filter === "new") list = list.filter(r => r.flags.includes("new"));
  if(u.filter === "favorites") list = list.filter(r => visitsOf(r.id).length >= 2);
  if(u.budget === "light") list = list.filter(r => r.price <= 2);
  if(u.budget === "high") list = list.filter(r => r.price >= 3);
  if(u.meal !== "any") list = list.filter(r => meals(r)[u.meal]);
  if(u.q) { const q = u.q.toLowerCase(); list = list.filter(r => (r.name+" "+r.cuisine.join(" ")+" "+r.hood).toLowerCase().includes(q)); }
  list.sort((a,b) => (avgOf(b.id)??0) - (avgOf(a.id)??0) || a.name.localeCompare(b.name));
  const total = R.filter(r => r.city === u.city).length;
  return `
  <section class="sec">
    <div class="sec-head"><h2>Explore</h2><span class="muted small num">${list.length} of ${total}</span></div>
    <div class="grid2">
      <div class="field"><label for="city">City</label><select class="input" id="city" data-change="city">${CITIES.map(c => `<option ${c===u.city?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label for="flt">Show</label><select class="input" id="flt" data-change="filter">
        ${[["all","Everything"],["untried","Not tried yet"],["new","New openings"],["favorites","Our favorites"]].map(([k,l]) => `<option value="${k}" ${k===u.filter?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="bud">Budget</label><select class="input" id="bud" data-change="budget">
        ${[["any","Any budget"],["light","Lighter ($–$$)"],["high","High end ($$$+)"]].map(([k,l]) => `<option value="${k}" ${k===u.budget?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="meal">Meal</label><select class="input" id="meal" data-change="meal">
        ${[["any","Any meal"],["breakfast","Breakfast & brunch"],["lunch","Lunch"],["dinner","Dinner"]].map(([k,l]) => `<option value="${k}" ${k===u.meal?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="search">${I.search}<input class="input" id="q" type="search" placeholder="Search restaurants, cuisines, neighborhoods" value="${esc(u.q)}" data-input="q"></div>
    <div class="chips" role="group" aria-label="Cuisine">${CUISINES.map(c => `<button class="chip" data-act="cuisine" data-c="${c}" aria-pressed="${c===u.cuisine}">${c}</button>`).join("")}</div>
  </section>
  <section class="sec" id="rlist">
    ${list.length ? list.map(r => rRow(r,t)).join("") : `<div class="empty">No matches here yet. Try another cuisine or city.</div>`}
    ${u.city === "Memphis" ? `<p class="proto">The full build pulls every Memphis restaurant live from Google Places, so this list becomes exhaustive and stays current.</p>` : ""}
  </section>`;
}
function rRow(r,t){
  const v = visitsOf(r.id).length, a = avgOf(r.id), rs = rotationState(r.id, t);
  const tags = [];
  if(r.flags.includes("new")) tags.push('<span class="pill wine">New</span>');
  if(!v) tags.push('<span class="pill brass">Not tried</span>');
  if(v) tags.push(`<span class="pill">Chosen ${v}× · last ${fmtDate(lastVisit(r.id))}</span>`);
  if(rs.state === "resting") tags.push(`<span class="pill">Resting until ${fmtDate(rs.back)}</span>`);
  if(rs.state === "returning") tags.push('<span class="pill good">Back in rotation</span>');
  return `<button class="r-row" data-act="rest" data-rid="${r.id}">
    <h3>${esc(r.name)}</h3><span class="score">${a ? `<span class="stars">★</span> ${a.toFixed(1)}` : "—"}</span>
    <span class="sub">${r.cuisine.join(" · ")} · ${esc(r.hood)}<br>${costText(r)} · ${mealText(r)}</span>
    ${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}
  </button>`;
}

  <section class="sec">
    <div class="field"><label for="p-title">Title</label><input class="input" id="p-title" data-d="title" value="${esc(d.title)}"></div>

      <div class="field"><label for="p-date">Date</label><input class="input" type="date" id="p-date" data-d="date" value="${d.date}"></div>

    </div>
    ${clash.length ? `<div class="warnbox">Heads up: ${clash.map(e => `${esc(F(e.host).name)}'s “${esc(e.title)}”`).join(", ")} is already on ${fmtDate(d.date)}. Pick another day or join that one instead.</div>` : ""}
    <div class="field"><label for="p-dress">Dress code</label><select class="input" id="p-dress" data-d="dress">${DRESS.map(x => `<option ${x===d.dress?"selected":""}>${x}</option>`).join("")}</select></div>
  </section>
  <section class="sec">

function bindPlan(){

/* ---------- Feed ---------- */
function vFeed(){
  const active = st.events.filter(e => e.status !== "done").sort((a,b) => a.date.localeCompare(b.date));
  const past = st.events.filter(e => e.status === "done").sort((a,b) => b.date.localeCompare(a.date));
  return `
  <section class="sec"><div class="sec-head"><h2>The Feed</h2><span class="muted small">${active.length} upcoming</span></div>
    ${active.length ? active.map(eventCard).join("") : `<div class="empty">Nothing on the calendar. Start one from <b>Plan</b>.</div>`}
  </section>
  <section class="sec"><div class="sec-head"><h2>Enjoyed together</h2></div>
    ${past.map(e => pastCard(e)).join("") || `<div class="empty">After your first dinner, memories land here.</div>`}
  </section>`;
}
function eventCard(e){
  const host = F(e.host); const isHost = e.host === st.me;
  const occ = (OCCASIONS.find(o => o.k === e.type) || {}).label;
  let body = "";
  if(e.status === "open"){
    const tally = {}; e.options.forEach(o => tally[o] = []); Object.entries(e.votes).forEach(([m,o]) => tally[o] && tally[o].push(m));
    const n = Object.keys(e.votes).length;
    const lead = Math.max(...Object.values(tally).map(a => a.length));
    const leaders = e.options.filter(o => tally[o].length === lead && lead > 0);
    body += `<div class="sec" style="gap:8px">${e.options.map(o => { const r = RBY[o]; const mine = e.votes[st.me] === o;
      return `<button class="opt ${mine?"mine":""}" data-act="vote" data-id="${e.id}" data-rid="${o}"><span class="bar" style="width:${n?tally[o].length/st.fam.length*100:0}%"></span><span><b>${esc(r.name)}</b><br><span class="small muted">${r.cuisine[0]} · ${$(r.price)}${mine?" · your vote":""}</span></span><span style="display:grid;justify-items:end;gap:4px"><span class="count">${tally[o].length}</span><span class="stack">${tally[o].map(m => av(m,"xs")).join("")}</span></span></button>`; }).join("")}</div>
      <div class="strip"><span class="grow">${n}/${st.fam.length} voted${leaders.length>1?` · tie between ${leaders.map(o=>esc(RBY[o].name)).join(" & ")} — ${esc(host.name)} breaks it`:""}</span>
      ${isHost ? `<button class="btn sm primary" data-act="lock" data-id="${e.id}" ${lead?"":"disabled"}>Lock in ${leaders.length===1?esc(RBY[leaders[0]].name.split(" ")[0]):"winner"}</button>` : `<span class="muted">Host locks it in</span>`}</div>`;
  } else {
    body += inviteCard(e);
  }
  // reservation
  const res = e.reservation;
  if(e.status === "set"){
    const r = RBY[e.chosen];
    body += res.status === "none" ? `<div class="strip"><span class="pill bad">Not reserved</span><span class="grow">Claim it so no one double-books.</span><button class="btn sm" data-act="res-claim" data-id="${e.id}">I'll book it</button></div>`
      : res.status === "claimed" ? `<div class="strip"><span class="pill warn">Booking</span><span class="grow"><b>${esc(F(res.by).name)}</b> is calling ${esc(r.name)} now. Please don't book.</span>${res.by===st.me?`<button class="btn sm primary" data-act="res-book" data-id="${e.id}">Mark booked</button><button class="btn sm ghost" data-act="res-release" data-id="${e.id}">Release</button>`:""}</div>`
      : `<div class="strip"><span class="pill good">Reserved</span><span class="grow">by ${esc(F(res.by).name)}${res.conf?` · conf <span class="num">${esc(res.conf)}</span>`:""} · party of ${partySize(e)}</span></div>`;
  }
  // rsvp
  const my = e.rsvp[st.me];
  const counts = {yes:0,maybe:0,no:0}; Object.values(e.rsvp).forEach(v => counts[v]++);
  body += `<div class="sec" style="gap:8px"><div class="lbl">ARE YOU COMING? <span class="muted" style="font-weight:400">· ${counts.yes} yes · ${counts.maybe} maybe · ${counts.no} can't</span></div>
    <div class="rsvp">${[["yes","I'll be there"],["maybe","Maybe"],["no","Can't make it"]].map(([k,l]) => `<button class="${k}" data-act="rsvp" data-id="${e.id}" data-v="${k}" aria-pressed="${my===k}">${l}</button>`).join("")}</div>
    <div class="stack">${st.fam.filter(f => e.rsvp[f.id]==="yes").map(f => av(f.id,"sm")).join("")}</div></div>`;
  // guests
  if(e.guests.length){
    body += `<div class="divider"></div><div class="sec" style="gap:10px"><div class="lbl">GUEST REQUESTS · ${majority()} HANDS NEEDED</div>${e.guests.map(g => { const ok = guestApproved(g); const up = g.hands.includes(st.me);
      return `<div class="guest"><span class="grow"><b>${esc(g.name)}</b><br><span class="small muted">asked by ${esc(F(g.by).name)}</span></span><span class="stack">${g.hands.map(m => av(m,"xs")).join("")}</span>${ok?`<span class="pill good">Welcome ✓</span>`:`<button class="hands" data-act="hand" data-id="${e.id}" data-g="${g.id}" aria-pressed="${up}">✋ ${g.hands.length}/${majority()}</button>`}</div>`; }).join("")}</div>`;
  }
  if(e.status === "set"){
    const ar = st.arrivals[e.id] || {}; const here = Object.values(ar).filter(a => a.s === "here").length;
    body += `<div class="actions"><button class="btn primary" data-act="reveal" data-id="${e.id}">Open dinner card${here?` · ${here} arrived`:""}</button>
      <a class="btn sm" href="${mailInvite(e)}">Email invitation</a><button class="btn sm ghost" data-act="copy-invite" data-id="${e.id}">Copy text</button></div>`;
  }
  body += `<div class="actions" style="margin-top:2px">

const VOTE_MS = 10 * 60 * 1000;
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
function lockEvent(e){
  const tally = {}; e.options.forEach(o => tally[o] = 0); Object.values(e.votes).forEach(o => { if(o in tally) tally[o]++; });
  const lead = Math.max(...Object.values(tally)); const leaders = e.options.filter(o => tally[o] === lead);
  const hv = e.votes[e.host];
  e.chosen = leaders.includes(hv) ? hv : leaders[0]; e.status = "set"; save();
}
const liveEl = document.getElementById("live"), revealEl = document.getElementById("reveal");
let liveId = null, liveTimer = null, simOn = true;
function openLive(id){
  const e = ev(id); if(!e || e.status !== "open") return;
  if(!e.voteEnds){ e.voteEnds = Date.now() + VOTE_MS; save(); toast("Vote is open — the family has 10 minutes"); }
  liveId = id; liveEl.hidden = false; document.body.style.overflow = "hidden"; drawLive();
  clearInterval(liveTimer); liveTimer = setInterval(tickLive, 1000);
}
function closeLive(){ clearInterval(liveTimer); liveEl.hidden = true; liveId = null; document.body.style.overflow = ""; render(); }
function tickLive(){
  const e = ev(liveId); if(!e){ closeLive(); return; }
  if(simOn && Math.random() < .2){
    const missing = st.fam.filter(f => f.id !== st.me && !e.votes[f.id]);
    if(missing.length){ const m = missing[Math.floor(Math.random()*missing.length)]; e.votes[m.id] = e.options[Math.floor(Math.random()*e.options.length)]; save(); drawLive(); toast(`${m.name} voted`); }
  }
  const left = e.voteEnds - Date.now();
  if(left <= 0 || Object.keys(e.votes).length >= st.fam.length){ finishLive(e); return; }
  const c = document.getElementById("cd"); if(c){ c.textContent = mmss(left); c.classList.toggle("low", left < 60000); }
}
function finishLive(e){
  if(e.status === "open") lockEvent(e);
  clearInterval(liveTimer); liveEl.hidden = true; liveId = null; document.body.style.overflow = "";
  render(); openReveal(e.id);
}

function superlatives(r){
  const out = []; const v = visitsOf(r.id).length; const a = avgOf(r.id); const ca = critAvg(r.id); const rs = rotationState(r.id, iso(today0));
  if(v >= 2) out.push(["♥", `Family favorite — chosen ${v} times`]);
  if(!v) out.push(["✦", "A first for this table — nobody's been yet"]);
  if(rs.state === "returning") out.push(["↺", "Back in rotation after 90+ days"]);
  if(a && a >= 4.4) out.push(["★", `Top-rated by the family: ${a.toFixed(1)} of 5`]);
  const best = CRIT.filter(([k]) => ca[k] && ca[k] >= 4.8).map(([,l]) => l.toLowerCase());
  if(best.length) out.push(["◆", `Our highest marks: ${best.join(", ")}`]);

}

    <section class="card">
      <div class="lbl">CHECK IN</div>
      <div class="seg" role="group" aria-label="My status">
        <button data-act="arrive" data-s="way" aria-pressed="${mine==="way"}">I'm on my way</button>
        <button data-act="arrive" data-s="here" aria-pressed="${mine==="here"}">I've arrived</button>
      </div>
      <div>${coming.map(f => { const a = ar[f.id];
        const pill = !a ? '<span class="pill">Not left yet</span>' : a.s === "way" ? `<span class="pill warn">On the way · ${fmtClock(a.t)}</span>` : `<span class="pill good">Here · ${fmtClock(a.t)}</span>`;
        return `<div class="arr">${av(f.id,"sm")}<span><b>${esc(F(f.id).name)}</b></span>${pill}</div>`; }).join("")}
        ${e.guests.filter(guestApproved).map(g => `<div class="arr"><span class="avatar sm" style="background:var(--surface-2);color:var(--ink)">${esc(g.name[0])}</span><span><b>${esc(g.name)}</b><small>guest</small></span><span class="pill">Guest</span></div>`).join("")}
      </div>
      <div class="small muted">${Object.values(ar).filter(a => a.s==="here").length} of ${coming.length} family at the table</div>
    </section>
    <section class="card">
      <div class="lbl">TONIGHT'S HIGHLIGHTS</div>
      ${superlatives(r).map(([ic,t]) => `<div class="sup"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join("")}
    </section>
    <div class="wine"><span class="eyebrow">Sommelier's note</span><b>${esc(wine)}</b><span class="small">${esc(dish)}</span><span class="small muted">${NA}</span></div>
    <p class="proto">In the full app, “I've arrived” sends everyone a quick alert.</p>
  </div>`;
}
function sheetBook(id){
  openSheet(`<div class="sheet-head"><h2>Reservation booked</h2><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="field"><label for="b-conf">Confirmation number (optional)</label><input class="input" id="b-conf" placeholder="e.g. OT-38291"></div>
    <p class="small muted" style="margin:0">Party of ${partySize(ev(id))} confirmed so far. The full build connects OpenTable / Resy to book in-app.</p>
    <button class="btn primary block" data-act="res-book-go" data-id="${id}">Save &amp; tell the family</button>`);
}

/* Concierge: wine + tip calculator */
const TIP_BY_SERVICE = {1:12,2:15,3:18,4:20,5:22};
function sheetConcierge(id){
  const e = ev(id); const r = RBY[e.chosen]; const [wine, dish] = pairing(r); const diners = Math.max(1, partySize(e));
  openSheet(`<div class="sheet-head"><div style="flex:1"><div class="eyebrow">Your concierge</div><h2>${esc(r.name)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="wine"><span class="eyebrow">Wine &amp; dinner</span><b>${esc(wine)}</b><span class="small">${esc(dish)}</span><span class="small muted">${NA}</span></div>
    <div class="sec"><div class="lbl">BILL &amp; TIP</div>
      <div class="grid2">
        <div class="field"><label for="c-sub">Food &amp; drink subtotal</label><input class="input num" id="c-sub" inputmode="decimal" value="240.00" data-calc></div>
        <div class="field"><label for="c-tax">Sales tax %</label><input class="input num" id="c-tax" inputmode="decimal" value="${r.city==="Memphis"?"9.75":"9.00"}" data-calc></div>
      </div>
      <div class="field"><span class="lbl">How was the service?</span><div class="dots" role="group" aria-label="Service rating">${[1,2,3,4,5].map(n => `<button data-act="svc" data-n="${n}" aria-pressed="${n===4}">${n}</button>`).join("")}</div><span class="small muted" id="c-svc-note">Great service → 20%</span></div>
      <div class="grid2">
        <div class="field"><label for="c-diners">Splitting between</label><input class="input num" id="c-diners" type="number" min="1" value="${diners}" data-calc></div>
        <div class="field"><label for="c-auto">Gratuity already on bill?</label><select class="input" id="c-auto" data-calc><option value="0">No</option><option value="1">Yes (party of 6+)</option></select></div>
      </div>
      <div class="calc-out" id="c-out"></div>
      <p class="small muted" style="margin:0">Tip is figured on the pre-tax subtotal. Many restaurants add 18–20% automatically for parties of 6 or more, so check the bill before tipping again.</p>
    </div>`);
  sheet.dataset.svc = "4";
  calc();
}
function calc(){
  const out = document.getElementById("c-out"); if(!out) return;
  const sub = parseFloat(document.getElementById("c-sub").value) || 0;
  const tax = (parseFloat(document.getElementById("c-tax").value) || 0) / 100;
  const n = Math.max(1, parseInt(document.getElementById("c-diners").value) || 1);
  const auto = document.getElementById("c-auto").value === "1";
  const svc = +sheet.dataset.svc;
  const pct = auto ? 0 : TIP_BY_SERVICE[svc];
  const labels = {1:"Poor service → 12%",2:"Below par → 15%",3:"Solid → 18%",4:"Great service → 20%",5:"Exceptional → 22%"};
  document.getElementById("c-svc-note").textContent = auto ? "Gratuity included — add extra only for something special." : labels[svc];
  const t = sub*tax, tip = sub*pct/100, total = sub + t + tip;
  out.innerHTML = `<div class="line"><span>Subtotal</span><span class="num">${money(sub)}</span></div>
    <div class="line"><span>Tax</span><span class="num">${money(t)}</span></div>
    <div class="line"><span>Tip (${pct}%)</span><span class="num">${money(tip)}</span></div>
    <div class="line total"><span>Total</span><span class="num">${money(total)}</span></div>
    <div class="pp num">${money(total/n)}</div><div class="small muted" style="text-align:center">per person · ${n} diner${n>1?"s":""}</div>`;
}
sheet.addEventListener("input", e => { if(e.target.matches("[data-calc]")) calc(); });
sheet.addEventListener("change", e => { if(e.target.matches("[data-calc]")) calc(); });

/* Wrap-up: rate + who paid */
let wrapDraft = null;
function sheetWrap(id){
  const e = ev(id); const r = RBY[e.chosen];
  wrapDraft = {id, scores:{food:0,service:0,price:0,selection:0,clean:0,location:0}, pay:"all", forWhom: st.fam.find(f => f.id !== st.me).id};
  openSheet(`<div class="sheet-head"><div style="flex:1"><div class="eyebrow">How was it?</div><h2>${esc(r.name)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="sec" style="gap:10px">${CRIT.map(([k,l]) => `<div class="crit"><span class="small">${l}</span><div class="dots" role="group" aria-label="${l}">${[1,2,3,4,5].map(n => `<button data-act="score" data-k="${k}" data-n="${n}" aria-pressed="false">${n}</button>`).join("")}</div></div>`).join("")}</div>
    <div class="field"><label for="w-text">Brief feedback (everyone sees it)</label><textarea class="input" id="w-text" placeholder="What should the family remember?"></textarea></div>
    <div class="field"><span class="lbl">WHO PAID?</span>
      <div class="seg" style="grid-auto-flow:row;grid-template-columns:1fr 1fr">${[["all","I paid for all"],["for","I paid for…"],["split","We split it"],["self","Each paid own"]].map(([k,l]) => `<button data-act="pay" data-k="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("")}</div>
      <select class="input" id="w-for" hidden>${st.fam.filter(f => f.id !== st.me).map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select>
    </div>
    <div class="field"><label for="w-amt">Total paid</label><input class="input num" id="w-amt" inputmode="decimal" placeholder="0.00"></div>
    <div class="field"><label for="w-note">A moment from tonight (optional)</label><input class="input" id="w-note" placeholder="Posts to Enjoyed together"></div>
    <button class="btn primary block" data-act="wrap-go">Save &amp; share with the family</button>`);
}

/* ================= Actions ================= */
const ev = id => st.events.find(e => e.id === id);
let toastT;
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
const uid = p => p + Math.random().toString(36).slice(2,8);

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){ go(tab.dataset.tab); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case "close": closeSheet(); break;
    case "tips": sheetTips(); break;
    case "seat": sheetSeat(); break;
    case "be": st.me = id; save(); closeSheet(); draft = null; render(); toast(`You're now seated as ${ME().name}`); break;
    case "person-new": sheetPerson(b.dataset.kind, null); break;
    case "person-edit": sheetPerson(b.dataset.kind, id); break;
    case "person-save": {
      const kind = b.dataset.kind; const name = document.getElementById("pp-name").value.trim();
      if(!name){ toast("Add a name to save"); return; }
      const data = {name, email:document.getElementById("pp-email").value.trim(), phone:document.getElementById("pp-phone").value.trim()};
      if(kind === "contact") data.relation = document.getElementById("pp-rel").value.trim();
      const list = kind === "fam" ? st.fam : st.contacts;
      const p = id && list.find(x => x.id === id);
      if(p) Object.assign(p, data);
      else if(kind === "fam") st.fam.push({id:uid("m"), color:COLORS[st.fam.length % COLORS.length], ...data});
      else st.contacts.push({id:uid("c"), ...data});
      save(); closeSheet(); render(); toast(p ? "Saved" : kind === "fam" ? `${name} has a seat at the table` : `${name} added to contacts`); break; }
    case "person-del": if(b.dataset.armed){ if(b.dataset.kind === "fam") st.fam = st.fam.filter(f => f.id !== id); else st.contacts = st.contacts.filter(c => c.id !== id); save(); closeSheet(); render(); toast("Removed"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to remove"; } break;
    case "toggle-contact": { const c = st.contacts.find(x => x.id === b.dataset.cid); const i = draft.guests.findIndex(g => g.contactId === c.id);
      if(i >= 0) draft.guests.splice(i,1); else draft.guests.push({name:c.name, email:c.email, contactId:c.id}); render(); break; }
    case "gpick": { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); b.querySelector(".check").textContent = on ? "✓" : ""; on ? guestPick.add(b.dataset.cid) : guestPick.delete(b.dataset.cid); break; }
    case "quick-plan": newDraft(b.dataset.m === "host" ? "personal" : "sunday"); draft.mode = b.dataset.m; if(b.dataset.m === "host"){ draft.title = "Dinner with the family"; draft.dress = "Smart casual"; } go("plan"); break;
    case "live": openLive(id); break;
    case "live-close": closeLive(); break;
    case "live-vote": { const e2 = ev(liveId); e2.votes[st.me] = b.dataset.rid; save(); drawLive(); toast(`You voted for ${RBY[b.dataset.rid].name}`); break; }
    case "live-add": sheetBallotAdd(); break;
    case "ballot-add": { const e2 = ev(liveId); if(e2 && e2.options.length < 6) e2.options.push(b.dataset.rid); save(); closeSheet(); drawLive(); toast(`${RBY[b.dataset.rid].name} is on the ballot`); break; }
    case "live-end": finishLive(ev(liveId)); break;
    case "reveal": openReveal(id); break;
    case "reveal-close": closeReveal(); break;
    case "arrive": { const e2 = ev(revealId); st.arrivals[e2.id] ||= {}; st.arrivals[e2.id][st.me] = {s:b.dataset.s, t:Date.now()}; save(); drawReveal(); toast(b.dataset.s === "here" ? "Checked in. The family can see you're here" : "The family knows you're on the way"); break; }
    case "copy-invite": { const txt = inviteText(ev(id)); navigator.clipboard?.writeText(txt).then(() => toast("Invitation copied — paste it into a text"), () => toast("Couldn't copy on this device")); break; }
    case "reset-all": if(b.dataset.armed){ localStorage.removeItem(KEY); st = seed(); st.me = "m1"; save(); draft = null; render(); toast("Prototype data reset"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to reset"; } break;
    case "rest": sheetRest(b.dataset.rid); break;
    case "explore-filter": st.ui.filter = b.dataset.f; st.ui.city = "Memphis"; go("explore"); break;
    case "cuisine": st.ui.cuisine = b.dataset.c; save(); render(); break;
    case "plan-with": newDraft(b.dataset.occ || "sunday", b.dataset.rid); closeSheet(); go("plan"); break;
    case "event": go("feed"); setTimeout(() => document.getElementById("ev-"+id)?.scrollIntoView({behavior:"smooth",block:"start"}), 60); break;
    // plan
    case "occ": { const keep = draft.options; newDraft(b.dataset.k); draft.options = keep.slice(0, draft.mode==="host"?1:3); render(); break; }
    case "mode": draft.mode = b.dataset.m; if(draft.mode==="host") draft.options = draft.options.slice(0,1); render(); break;
    case "pick": { const rid = b.dataset.rid; const max = draft.mode==="host"?1:3; const i = draft.options.indexOf(rid);
      if(i >= 0) draft.options.splice(i,1);
      else if(b.dataset.resting){ toast("Resting — chosen within the last 90 days"); return; }
      else if(draft.mode === "host") draft.options = [rid];
      else if(draft.options.length < max) draft.options.push(rid); else { toast("Up to 3 choices for a vote"); return; }
      const sc = document.getElementById("pick-list")?.scrollTop; render(); const pl = document.getElementById("pick-list"); if(pl) pl.scrollTop = sc; break; }
    case "add-guest": { const v = document.getElementById("p-guest").value.trim(); const em = document.getElementById("p-guest-email").value.trim();
      if(!v){ toast("Type the guest's name first"); return; }
      const c = {id:uid("c"), name:v, email:em, phone:"", relation:`Guest of ${ME().name}`}; st.contacts.push(c); save();
      draft.guests.push({name:v, email:em, contactId:c.id}); render(); toast(`${v} saved to contacts`); break; }
    case "rm-guest": draft.guests.splice(+b.dataset.i,1); render(); break;
    case "reset-plan": newDraft(); render(); break;
    case "send": {
      const d = draft; if(!d.options.length) return;
      const e2 = {id:uid("e"),type:d.type,mode:d.mode,host:st.me,title:d.title.trim()||"Dinner",date:d.date,time:d.time,dress:d.dress,options:[...d.options],
        chosen:d.mode==="host"?d.options[0]:null,votes:{},rsvp:{[st.me]:"yes"},guests:d.guests.map(g => ({id:uid("g"),name:g.name,email:g.email||"",contactId:g.contactId||null,by:st.me,hands:[st.me]})),
        reservation:{status:"none",by:null,conf:""},note:d.note.trim(),status:d.mode==="host"?"set":"open",created:iso(today0)};
      st.events.push(e2); save(); draft = null; go("feed"); toast(d.mode==="host" ? "Invitation sent to the family" : "Vote sent — everyone's been alerted"); break; }
    // feed
    case "vote": { const e2 = ev(id); if(e2.status !== "open") return; e2.votes[st.me] = b.dataset.rid; save(); render(); toast(`Voted for ${RBY[b.dataset.rid].name}`); break; }
    case "lock": { const e2 = ev(id); lockEvent(e2); render(); openReveal(id); break; }
    case "rsvp": ev(id).rsvp[st.me] = b.dataset.v; save(); render(); break;
    case "hand": { const g = ev(id).guests.find(x => x.id === b.dataset.g); const i = g.hands.indexOf(st.me); i >= 0 ? g.hands.splice(i,1) : g.hands.push(st.me); save(); render(); if(guestApproved(g)) toast(`${g.name} is welcome at the table`); break; }
    case "ask-guest": sheetAskGuest(id); break;
    case "ask-guest-go": {
      const e2 = ev(id); const v = document.getElementById("g-name").value.trim(); const em = document.getElementById("g-email").value.trim();
      if(v){ const c = {id:uid("c"), name:v, email:em, phone:"", relation:`Guest of ${ME().name}`}; st.contacts.push(c); guestPick.add(c.id); }
      if(!guestPick.size){ toast("Pick a contact or type a name"); return; }
      guestPick.forEach(cid => { const c = st.contacts.find(x => x.id === cid); e2.guests.push({id:uid("g"),name:c.name,email:c.email||"",contactId:c.id,by:st.me,hands:[st.me]}); });
      const n = guestPick.size; save(); closeSheet(); render(); toast(`Asked the family about ${n} guest${n>1?"s":""} — hands up!`); break; }
    case "res-claim": { const e2 = ev(id); if(e2.reservation.status !== "none"){ toast(`${F(e2.reservation.by).name} already has it`); return; } e2.reservation = {status:"claimed",by:st.me,conf:""}; save(); render(); toast("Everyone can see you're booking"); break; }
    case "res-release": ev(id).reservation = {status:"none",by:null,conf:""}; save(); render(); break;
    case "res-book": sheetBook(id); break;
    case "res-book-go": { const e2 = ev(id); e2.reservation = {status:"booked",by:st.me,conf:document.getElementById("b-conf").value.trim()}; save(); closeSheet(); render(); toast("Reservation confirmed for the family"); break; }
    case "cancel": if(b.dataset.armed){ st.events = st.events.filter(x => x.id !== id); save(); render(); toast("Plan cancelled"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to cancel"; } break;
    case "concierge": sheetConcierge(id); break;
    case "svc": sheet.dataset.svc = b.dataset.n; sheet.querySelectorAll('[data-act="svc"]').forEach(x => x.setAttribute("aria-pressed", x === b)); calc(); break;
    case "wrap": sheetWrap(id); break;
    case "score": wrapDraft.scores[b.dataset.k] = +b.dataset.n; sheet.querySelectorAll(`[data-act="score"][data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", +x.dataset.n <= +b.dataset.n)); break;
    case "pay": wrapDraft.pay = b.dataset.k; sheet.querySelectorAll('[data-act="pay"]').forEach(x => x.setAttribute("aria-pressed", x === b)); document.getElementById("w-for").hidden = b.dataset.k !== "for"; break;
    case "wrap-go": {
      const e2 = ev(wrapDraft.id); const sc = wrapDraft.scores;
      if(Object.values(sc).some(v => !v)){ toast("Rate all six to save"); return; }
      const text = document.getElementById("w-text").value.trim();
      const amt = parseFloat(document.getElementById("w-amt").value) || 0;
      const moment = document.getElementById("w-note").value.trim();
      const pay = wrapDraft.pay;
      st.reviews.push({rid:e2.chosen,by:st.me,date:e2.date,scores:{...sc},text:text||"(no comment)"});
      if(!st.visits.some(v => v.eventId === e2.id)) st.visits.push({rid:e2.chosen,date:e2.date,eventId:e2.id});
      st.ledger = st.ledger.filter(l => l.eventId !== e2.id);
      st.ledger.push({eventId:e2.id,rid:e2.chosen,date:e2.date,payer:pay==="all"||pay==="for"?st.me:null,mode:pay,forWhom:pay==="for"?document.getElementById("w-for").value:null,amount:amt});
      if(moment) st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:e2.id,text:moment});
      e2.status = "done"; save(); closeSheet(); render(); toast("Saved — thanks for the review"); break; }
    case "note": { const inp = document.getElementById("note-"+id); const v = inp.value.trim(); if(!v) return; st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:id,text:v}); save(); render(); break; }
  }
});
setInterval(() => {
  document.querySelectorAll("[data-cd]").forEach(el => { const e = ev(el.dataset.cd); if(!e || !e.voteEnds) return; const left = e.voteEnds - Date.now(); el.textContent = mmss(left); if(left <= 0 && !liveId && app.hidden === false) render(); });
}, 1000);
document.addEventListener("change", e => {
  const c = e.target.dataset.change; if(!c) return;
  st.ui[c] = e.target.value; save(); render();
});
document.addEventListener("input", e => {
  if(e.target.dataset.input === "q"){ st.ui.q = e.target.value; save();
    const list = document.getElementById("rlist"); const pos = e.target.selectionStart; view.innerHTML = vExplore(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); }
});
})();
