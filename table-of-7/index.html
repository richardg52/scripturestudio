<!doctype html>

<title>Table of 7</title>
<meta name="author" content="Richard G. Clark">
<meta name="copyright" content="© 2026 Richard G. Clark. All rights reserved.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table of 7">
<!-- use-credentials: while the site sat behind a Netlify password (until 2026-10-18, his choice to remove it) the app description answered 401 without it and the phone never became a Home Screen app. Kept: harmless now, and right again if a password ever returns -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600..900;1,600..900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: one-column phone app shell (max 480px) — sticky header, scrolling view, fixed tab bar. Evening dining room: bottle green, brass, wine. */
:root{
  --bg:#0f1c18; --surface:#15261f; --surface-2:#1c3129; --line:rgba(222,200,150,.16);
  --ink:#efe9dc; --muted:#a3b0a6; --brass:#cfab6c; --brass-ink:#1a160c; --wine:#9a3343; --wine-soft:rgba(154,51,67,.18);
  --good:#86c596; --warn:#e3b45c; --bad:#e58474; --scrim:rgba(5,10,8,.62); --card-shadow:0 10px 30px rgba(0,0,0,.28);
  --paper:#f6f1e6; --paper-ink:#2a1f14; --paper-line:#c9b083;
  --f-display:"Nunito","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
a{color:var(--brass)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#1d3a30 0%,#0b1512 70%);color:#efe9dc;display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));transition:opacity .7s ease}
#splash.out{opacity:0;pointer-events:none}
.mark{position:relative;width:min(220px,58vw);aspect-ratio:1;max-width:100%;margin:0 auto 28px}
.mark svg{width:100%;height:100%;overflow:visible}
.mark .ring{stroke:#cfab6c;stroke-width:1.2;fill:none;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
.mark .seat{fill:#cfab6c;opacity:0;animation:pop .5s forwards}
.mark .five{font-family:var(--f-display);font-style:italic;fill:#efe9dc;font-size:78px;opacity:0;animation:fade .9s 1.2s forwards}
.splash-title{font-family:var(--f-display);font-size:clamp(34px,10vw,48px);letter-spacing:.06em;opacity:0;animation:rise .9s 1.4s forwards}
.splash-tag{margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#cfab6c;opacity:0;animation:fade .9s 1.9s forwards}
.splash-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;color:rgba(239,233,220,.5);opacity:0;animation:fade .6s 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Seat picker / greeting ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gate-inner{width:100%;max-width:420px;display:grid;gap:18px;justify-items:center}
.round{position:relative;width:min(300px,82vw);aspect-ratio:1;max-width:100%}
.round .tabletop{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--surface-2),var(--surface));border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--brass);font-size:42px}
.round .chair{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid transparent;color:#fff;font-weight:600;font-size:20px;display:grid;place-items:center;box-shadow:var(--card-shadow);transition:transform .2s}
.round .chair:hover{transform:scale(1.07)}
.round .chair span{position:absolute;top:100%;margin-top:4px;font-size:12px;color:var(--ink);font-weight:500;white-space:nowrap}
.greet{font-family:var(--f-display);font-size:clamp(30px,8vw,40px)}
.greet em{color:var(--brass)}
#gate.greeting .gate-inner{animation:rise .7s both}
.signin{width:100%;max-width:340px;display:grid;gap:12px;text-align:left}
.pin{font-family:var(--f-mono);font-size:26px;letter-spacing:.7em;text-align:center;padding-left:.7em}
.si-err{min-height:20px;font-size:13px;color:var(--bad);text-align:center}
.round.small{width:min(190px,52vw)}
.round.small .chair{width:38px;height:38px;margin:-19px 0 0 -19px;font-size:13px;pointer-events:none}
.round.small .chair span{display:none}
.round.small .tabletop{font-size:30px}

/* ---------- App shell ---------- */
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;flex:1}
.brand i{color:var(--brass)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:11px}
.avatar.xs{width:20px;height:20px;font-size:10px}
.stack{display:inline-flex}
.stack .avatar{border:2px solid var(--surface);margin-left:-6px}
.stack .avatar:first-child{margin-left:0}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;align-content:start}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brass)}
nav.tabs .plan-btn span.disc{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;box-shadow:var(--card-shadow)}
.badge-dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--wine);color:#fff;font-size:10px;line-height:16px;font-weight:700}

/* ---------- Sections & cards ---------- */
.sec{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:22px}
.link-btn{background:none;border:0;color:var(--brass);font-weight:600;font-size:13px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.hello h1{font-size:32px;line-height:1.1}
.hello h1 em{color:var(--brass)}
.hello p{margin:6px 0 0;color:var(--muted)}
.feature{position:relative;overflow:hidden;border-radius:18px;padding:20px;background:linear-gradient(150deg,var(--wine) 0%,color-mix(in srgb,var(--wine) 55%,var(--bg)) 100%);color:#fbeff0;display:grid;gap:8px;box-shadow:var(--card-shadow)}
.feature .eyebrow{color:#f4d9a8}
.feature h3{font-size:28px;line-height:1.1}
.feature .meta{font-size:13px;opacity:.85}
.feature .why{font-size:13px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.feature .actions .btn{background:#fbeff0;color:#5a1622;border-color:transparent}
.feature .actions .btn.ghost{background:transparent;color:#fbeff0;border-color:rgba(251,239,240,.4)}
.feature .plate{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(244,217,168,.35);box-shadow:inset 0 0 0 14px rgba(244,217,168,.06)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.alt b{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.wine{background:var(--wine);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.brass{color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent)}
.pill.wine{color:#fff;background:var(--wine)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.todo .ic{width:34px;height:34px;border-radius:50%;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;flex:none}
:root .todo .ic{color:var(--bad)}
.todo b{display:block;font-weight:600}
.todo small{color:var(--muted)}
.todo .chev{margin-left:auto;color:var(--muted)}
.scroller{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-2px}
.scroller > *{scroll-snap-align:start;flex:0 0 72%}

/* ---------- Restaurant rows ---------- */
.r-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.r-row h3{font-size:18px;line-height:1.2}
.r-row .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.r-row .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.r-row .score{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--brass)}
.stars{color:var(--brass);letter-spacing:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:transparent;color:var(--brass-ink)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}

/* ---------- Events ---------- */
.event{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.event .ev-head{padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.event .ev-head .who{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.event .ev-head .who b{color:var(--ink);font-weight:600}
.event .ev-body{padding:12px 16px 16px;display:grid;gap:14px}
.event h3{font-size:22px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%;position:relative;overflow:hidden}
.opt.mine{border-color:var(--brass)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--brass) 12%,transparent);z-index:0;transition:width .4s}
.opt > *:not(.bar){position:relative;z-index:1}
.opt b{font-family:var(--f-display);font-weight:700;font-size:17px}
.opt .count{font-family:var(--f-mono);font-size:13px}
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;flex-wrap:wrap}
.strip .grow{flex:1;min-width:150px}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px}
.rsvp button[aria-pressed="true"].yes{background:var(--good);color:#0d1f14;border-color:transparent}
.rsvp button[aria-pressed="true"].maybe{background:var(--warn);color:#241a05;border-color:transparent}
.rsvp button[aria-pressed="true"].no{background:var(--bad);color:#2a0d08;border-color:transparent}
.guest{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guest .grow{flex:1;min-width:120px}
.hands{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.hands[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.divider{height:1px;background:var(--line)}

/* ---------- Invitation: formal stationery, same paper in both themes ---------- */
.invite{background:linear-gradient(180deg,#fcf9f1 0%,#f3ebda 100%);color:var(--paper-ink);border-radius:3px;padding:38px 26px 30px;text-align:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.28);display:grid;gap:12px;justify-items:center}
.invite::before{content:"";position:absolute;inset:9px;border:1px solid var(--paper-line);pointer-events:none}
.invite::after{content:"";position:absolute;inset:14px;border:.5px solid rgba(201,176,131,.55);pointer-events:none}
.invite > *{position:relative;z-index:1}
.i-mono{width:60px;height:60px;border-radius:50%;border:1px solid #b08d4c;box-shadow:inset 0 0 0 3px #fcf9f1,inset 0 0 0 4px rgba(176,141,76,.5);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:22px;color:#8a6a2c}
.i-caps{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#8a6a2c;font-weight:600;max-width:30ch;line-height:1.7}
.i-script{font-family:var(--f-script);font-size:38px;line-height:1.05;color:#5a1622;font-weight:400}
.i-title{font-family:var(--f-display);font-size:26px;line-height:1.15;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-wrap:balance;max-width:16ch}
.i-host{font-family:var(--f-display);font-style:italic;font-size:16px;color:#5b4a36}
.i-flour{width:150px;height:14px;color:#b08d4c}
.i-when{font-family:var(--f-display);font-size:17px;line-height:1.55}
.i-when em{display:block;font-size:14px;color:#5b4a36}
.i-rest{font-family:var(--f-display);font-size:23px;letter-spacing:.07em;text-transform:uppercase;line-height:1.2;text-wrap:balance}
.i-addr{font-size:13px;color:#5b4a36;margin-top:-6px}
.i-grid{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:10px 0}
.i-grid > div{display:grid;gap:3px;font-size:12.5px;padding:0 4px;align-content:start}
.i-grid > div + div{border-left:1px solid var(--paper-line)}
.i-grid span{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8a6a2c;font-weight:700}
.i-note{font-family:var(--f-display);font-style:italic;font-size:15.5px;color:#5b4a36;max-width:30ch;line-height:1.5}
.i-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.i-links a{font-size:12px;font-weight:600;letter-spacing:.04em;color:#5a1622;border:1px solid #c9b083;border-radius:999px;padding:7px 13px;text-decoration:none;background:rgba(255,255,255,.4)}
.i-dress{font-size:12px;font-style:italic;color:#5b4a36;margin-top:-4px}
.i-req{display:grid;gap:3px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a2c;font-weight:700;line-height:1.5}
.i-reply{font-family:var(--f-script);font-size:24px;color:#5a1622;line-height:1.2}

/* envelope teaser in the feed */
.envelope{position:relative;border-radius:4px;background:#efe4cf;color:#2a1f14;padding:0 18px 18px;text-align:center;overflow:hidden;display:grid;gap:6px;justify-items:center;border:1px solid #d9c6a0;width:100%;box-shadow:var(--card-shadow)}
.envelope .flap{position:absolute;inset:0 0 auto;height:74px;background:#e5d4b4;clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:relative;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8455a,#7d1e2e 70%);color:#f4d9a8;font-family:var(--f-display);font-style:italic;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);margin-top:48px}
.envelope .from{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#8a6a2c;font-weight:700;margin-top:6px}

/* full-screen invitation */

/* alerts, photos, misc */
.bell{position:relative}
.bell .badge-dot{top:-3px;left:auto;right:-3px}
.alert-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.disc{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--f-display)}
/* ================= Game Room: the stage (his order, 2026-10-17: vivid, full screen, sharp, big for every age) =================
   Every game screen opens full screen on its own rich backdrop. Boards, pieces and cards are drawn as vectors
   (SVG and gradients), so they are sharp at any size, on any screen. --gs scales every game for Large / Extra large. */
#sheet-wrap.stage{background:#04070f}
#sheet-wrap.stage .sheet{--gs:1;max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:0;color:#f6f2e8;
  background:radial-gradient(120% 70% at 50% -10%,#24406e 0%,#111f3a 42%,#070c18 100%) fixed;
  padding-top:max(12px,env(safe-area-inset-top,0px));gap:14px;transform:none;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;overflow-x:hidden}
body[data-gsize="xl"] #sheet-wrap.stage .sheet{--gs:1.25}
#sheet-wrap.stage .grab{display:none}
#sheet-wrap.stage .sheet > *{width:100%;max-width:900px;margin-inline:auto}
.stage .sheet-head{align-items:center}
.stage .sheet-head > [data-act="g-back"]{order:-1}
.stage .sheet-head h2{color:#fff;font-size:calc(22px*var(--gs));line-height:1.15}
.stage .eyebrow{color:#ffd36b;font-size:calc(11.5px*var(--gs));font-weight:800}
.stage .muted,.stage .small.muted{color:#b8c4dc}
.stage .small{font-size:calc(14px*var(--gs))}
.stage .lbl,.stage .field label{color:#ffd36b;font-size:calc(12.5px*var(--gs));font-weight:800;letter-spacing:.08em}
.stage .icon-btn{width:calc(46px*var(--gs));height:calc(46px*var(--gs));background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;font-size:calc(19px*var(--gs));font-weight:800}
.stage .icon-btn.gsz{font:900 calc(15px*var(--gs))/1 var(--f-display);letter-spacing:-.02em}
.stage .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#f6f2e8;font-size:calc(15px*var(--gs))}
.stage .strip{background:rgba(255,255,255,.08);color:#f6f2e8;font-size:calc(14px*var(--gs))}
.stage .empty{color:#b8c4dc;border-color:rgba(255,255,255,.2)}
.stage .input,.stage select.input{background:#0c1830;border-color:rgba(255,255,255,.25);color:#fff;font-size:calc(16px*var(--gs));padding:calc(12px*var(--gs)) 14px}
.stage .btn{font-size:calc(15px*var(--gs));padding:calc(12px*var(--gs)) calc(20px*var(--gs));font-weight:800;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.stage .btn.sm{font-size:calc(14px*var(--gs));padding:calc(9px*var(--gs)) calc(15px*var(--gs))}
.stage .btn.primary{background:linear-gradient(180deg,#ffe08a,#ffb627 55%,#e8930c);color:#3a2200;border-color:#ffefb3;box-shadow:0 4px 0 #a5620a,0 8px 18px rgba(255,170,30,.35)}
.stage .btn.wine{background:linear-gradient(180deg,#ff6b8a,#e3264f 55%,#b4123a);color:#fff;border-color:#ff9db1;box-shadow:0 4px 0 #7d0a27,0 8px 18px rgba(227,38,79,.35)}
.stage .btn.ghost{background:transparent}
.stage .btn:active{transform:translateY(2px)}
.stage .todo{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff;font-size:calc(15px*var(--gs))}
.stage .todo small,.stage .person small{color:#b8c4dc}
.stage .person{color:#fff}
.gstatus{text-align:center;font:900 calc(19px*var(--gs))/1.25 var(--f-display);padding:calc(12px*var(--gs)) 14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);color:#fff}
.gstatus.go{background:linear-gradient(180deg,#ffe08a,#ffb627);color:#3a2200;border-color:#fff1bd;box-shadow:0 0 0 3px rgba(255,200,60,.25),0 10px 24px rgba(255,170,30,.3);animation:gpulse 1.6s ease-in-out infinite}
.gstatus.win{background:linear-gradient(180deg,#7dffb0,#19c36a);color:#04331a;border-color:#c9ffe0}
@keyframes gpulse{50%{box-shadow:0 0 0 7px rgba(255,200,60,.12),0 10px 24px rgba(255,170,30,.3)}}
.gscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.gscore .team{border-radius:16px;padding:calc(10px*var(--gs)) 12px;text-align:center;background:rgba(255,255,255,.07);border:2px solid transparent;min-width:0}
.gscore .team b{display:block;font:900 calc(15px*var(--gs))/1.2 var(--f-display);overflow-wrap:anywhere}
.gscore .team .pts{font:900 calc(30px*var(--gs))/1.05 var(--f-display);color:#ffd36b}
.gscore .team.on{border-color:#ffd36b;box-shadow:0 0 20px rgba(255,211,107,.35);background:rgba(255,211,107,.12)}
.gscore .vs{align-self:center;font:900 calc(15px*var(--gs)) var(--f-display);color:#8fa0c2}
/* Game Room: a picture menu */
.gtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:640px){.gtiles{grid-template-columns:repeat(3,1fr)}}
.gtile{position:relative;display:grid;grid-template-rows:1fr auto;border:0;border-radius:24px;padding:12px 12px 14px;color:#fff;text-align:left;overflow:hidden;min-height:calc(190px*var(--gs));

.gtile:active{transform:scale(.97)}
.gtile svg{width:100%;height:100%;max-height:calc(132px*var(--gs));filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.gtile b{font:900 calc(18px*var(--gs))/1.1 var(--f-display);text-shadow:0 2px 4px rgba(0,0,0,.4)}
.gtile small{display:block;font-size:calc(12.5px*var(--gs));opacity:.92;margin-top:2px;font-weight:600}
.gtile .badge{position:absolute;top:10px;right:10px;background:#ff3b5c;color:#fff;border-radius:999px;padding:3px 9px;font:900 12px var(--f-display);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.gt-ttt,.todo .ic.gt-ttt{background:linear-gradient(150deg,#3b2b8f,#1b1450)}.gt-c4,.todo .ic.gt-c4{background:linear-gradient(150deg,#1f7bff,#0b3c9e)}
.gt-ck,.todo .ic.gt-ck{background:linear-gradient(150deg,#b5651d,#5b2c0c)}.gt-sp,.todo .ic.gt-sp{background:linear-gradient(150deg,#14a35a,#06512a)}
.gt-tv,.todo .ic.gt-tv{background:linear-gradient(150deg,#c42dff,#4b0f9e)}.gt-fd,.todo .ic.gt-fd{background:linear-gradient(150deg,#ff8a1f,#c4300e)}
.gpick{display:grid;gap:14px;justify-items:center;text-align:center}
.gpick .art{width:min(70vw,calc(230px*var(--gs)));aspect-ratio:1;border-radius:32px;display:grid;place-items:center;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.gpick .art svg{width:100%;height:100%}
.gpick .btn{width:min(100%,460px);min-height:calc(56px*var(--gs))}
/* boards: as big as the screen allows */
.gboard{display:grid;margin:0 auto;width:min(100%,calc(100dvh - 300px),720px);min-width:min(100%,300px);touch-action:manipulation;position:relative}
.gboard button{aspect-ratio:1;border:0;padding:0;display:grid;place-items:center;background:none;position:relative}
.gboard button:disabled{cursor:default}
/* Tic-Tac-Toe: glowing grid, big colored X and O drawn in */
.gboard.ttt{grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;border-radius:28px;background:linear-gradient(160deg,#1d2c5c,#0b1430);box-shadow:inset 0 0 0 2px rgba(120,160,255,.35),0 18px 40px rgba(0,0,0,.5)}
.gboard.ttt button{border-radius:20px;background:radial-gradient(circle at 50% 35%,#24386e,#132350);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 12px rgba(0,0,0,.35)}
.gboard.ttt button:not(:disabled):active{background:#2e468a}
.gboard.ttt svg{width:94%;height:94%;overflow:visible}
.gboard.ttt .xo{fill:none;stroke-width:17;stroke-linecap:round}
.gboard.ttt .new .xo{stroke-dasharray:1;stroke-dashoffset:1;animation:gdraw .45s ease-out forwards}
.gboard.ttt .new .xo + .xo{animation-delay:.2s}
@keyframes gdraw{to{stroke-dashoffset:0}}
.gboard.ttt button.win{background:radial-gradient(circle,#4a5fb0,#1d2f6b);animation:gwin 1s ease-in-out infinite alternate}
@keyframes gwin{to{box-shadow:0 0 0 4px #ffd36b,0 0 30px #ffd36b}}
.tcol{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:calc(14px*var(--gs))}
.tcol button{width:calc(34px*var(--gs));height:calc(34px*var(--gs));border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.tcol button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
/* Connect Four: a glossy blue frame, discs that drop */
.gboard.c4{grid-template-columns:repeat(7,1fr);gap:0;padding:2.2%;border-radius:22px;background:linear-gradient(180deg,#3f8cff,#1553d6 40%,#0e3fa8);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -6px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.55)}
.gboard.c4 button{overflow:hidden}
.gboard.c4 button::before{content:"";position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#030a1c,#0b1a3c);box-shadow:inset 0 5px 8px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.35)}
.gboard.c4 button.col-hot::before{background:radial-gradient(circle at 50% 30%,#13265a,#1d3a7a)}
.gp{position:relative;border-radius:50%;width:82%;height:82%;z-index:1}
.c4 .gp.p0{background:radial-gradient(circle at 36% 30%,#ffb3b3 0,#ff4040 22%,#d8101f 62%,#8f0712 100%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.14),inset 0 -5px 9px rgba(0,0,0,.35)}
.c4 .gp.p1{background:radial-gradient(circle at 36% 30%,#fffbd0 0,#ffe23a 22%,#f2b400 62%,#a77400 100%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 -5px 9px rgba(0,0,0,.3)}
.c4 .gp::after{content:"";position:absolute;inset:22%;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.c4 .new .gp{animation:gdrop .5s cubic-bezier(.4,0,.6,1) both}
@keyframes gdrop{0%{transform:translateY(calc(var(--r,1) * -112%))}80%{transform:translateY(0)}90%{transform:translateY(-7%)}100%{transform:translateY(0)}}
.c4 .win .gp{animation:gwin2 .8s ease-in-out infinite alternate}
@keyframes gwin2{to{box-shadow:0 0 0 4px #fff,0 0 22px #fff}}
/* Checkers: wood board, glossy ridged pieces, slide with a finger */
.ckwrap{padding:3.2%;border-radius:18px;margin:0 auto;width:min(100%,calc(100dvh - 300px),720px);min-width:min(100%,300px);
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.06) 3px 9px),linear-gradient(135deg,#8a5428,#5a3214 50%,#7a4620);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.6)}
.gboard.ck{width:100%;min-width:0;grid-template-columns:repeat(8,1fr);touch-action:none;box-shadow:0 0 0 2px #3b1e08}
.gboard.ck button{background:repeating-linear-gradient(80deg,rgba(150,100,40,.10) 0 2px,transparent 2px 7px),linear-gradient(135deg,#f6e2b5,#e7c98f)}
.gboard.ck button.dk{background:repeating-linear-gradient(80deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px),linear-gradient(135deg,#7a4a22,#5a3416)}
.gboard.ck button.sel{box-shadow:inset 0 0 0 4px #ffd36b}
.gboard.ck button.to::after{content:"";position:absolute;width:34%;height:34%;border-radius:50%;background:radial-gradient(circle,#fff6c8,#ffd36b 60%,rgba(255,211,107,0) 72%);animation:gbeat 1s ease-in-out infinite}
.gboard.ck button.hot{box-shadow:inset 0 0 0 5px #7dffb0}
@keyframes gbeat{50%{transform:scale(1.25)}}
.ck .gp{width:80%;height:80%;display:grid;place-items:center}
.ck .gp.p0{background:radial-gradient(circle at 38% 32%,#ff9a8a 0,#ff3d2e 30%,#c41a0e 70%,#7a0c05);box-shadow:0 4px 0 #5a0904,0 8px 12px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.15)}
.ck .gp.p1{background:radial-gradient(circle at 38% 32%,#8a8a8a 0,#3c3c3c 30%,#1a1a1a 70%,#000);box-shadow:0 4px 0 #000,0 8px 12px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.12)}
.ck .gp::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.ck .gp svg{width:58%;height:58%;position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}

/* Spades: a green felt table, real cards */

.felt::after{content:"T7";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 calc(54px*var(--gs)) var(--f-display);color:rgba(255,255,255,.07);letter-spacing:.1em;pointer-events:none}

.mmc .back::after{content:"T7";font:900 calc(20px*var(--gs)) var(--f-display);color:rgba(255,255,255,.85)}

.wgballoons{display:flex;justify-content:center;gap:6px;font-size:calc(38px*var(--gs))}

.hand .pcard.ok .card-svg{filter:drop-shadow(0 0 7px rgba(255,211,107,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.4))}

.bidpad{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;max-width:560px;width:100%}
.chip{aspect-ratio:1;border-radius:50%;border:0;padding:0;min-width:0;font:900 calc(18px*var(--gs)) var(--f-display);color:#fff;

.chip.nil{background:radial-gradient(circle,#e3264f 0 46%,#fff 47% 52%,#e3264f 53% 64%,#fff 65% 70%,#a8143a 71%);box-shadow:0 4px 0 #6d0a22,0 6px 10px rgba(0,0,0,.4);font-size:calc(13px*var(--gs))}

.backs{display:flex}.backs svg{width:calc(20px*var(--gs));margin-left:calc(-14px*var(--gs))}.backs svg:first-child{margin-left:0}

/* Family Feud: the TV board */
.fboard{border-radius:24px;padding:12px;background:linear-gradient(180deg,#0b2a7a,#06143d);box-shadow:inset 0 0 0 4px #e9b23a,inset 0 0 0 7px #7a5410,0 18px 40px rgba(0,0,0,.55);display:grid;gap:8px}

/* ---------- Sheet ---------- */
#sheet-wrap{position:fixed;inset:0;z-index:85;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;gap:16px;align-content:start}
#sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:26px;flex:1;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.review{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--surface)}
.review .top{display:flex;align-items:center;gap:8px;font-size:13px}
.review p{margin:0;font-size:14px}
.crit{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.dots.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots.ten button{width:auto;aspect-ratio:1;height:auto;min-width:0;padding:0}
.dots button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.calc-out{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--surface);font-size:14px}
.calc-out .line{display:flex;justify-content:space-between;gap:12px}
.calc-out .total{font-size:18px;font-weight:700;border-top:1px dashed var(--line);padding-top:8px}
.calc-out .pp{font-family:var(--f-display);font-size:28px;color:var(--brass);text-align:center}
.wine{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--wine-soft);border:1px solid color-mix(in srgb,var(--wine) 30%,transparent)}
.wine b{font-family:var(--f-display);font-weight:700;font-size:17px}
.tip{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.tip .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-style:italic}
.tip p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tip b{font-weight:600}
.ledger-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger-row:last-child{border-bottom:0}
.fav{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fav:last-child{border-bottom:0}
.fav .rank{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--brass);text-align:center}
.fav b{font-family:var(--f-display);font-weight:700;font-size:17px;display:block;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border-radius:12px;background:var(--surface)}
.note p{margin:2px 0 0;font-size:14px}
.empty{text-align:center;padding:26px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.warnbox{padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pick-list{display:grid;gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--surface))}
.pick .grow{flex:1;min-width:0}
.pick b{font-weight:600;display:block}
.pick small{color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.pick[aria-pressed="true"] .check{background:var(--brass);border-color:transparent;color:var(--brass-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:95;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px}

/* ---------- Live vote & welcome (full screen) ---------- */
#live,#reveal,#host,#cardov,#tab{position:fixed;inset:0;z-index:70;overflow-y:auto;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
#host{z-index:71}
#cardov,#tab{z-index:74}
#reveal{background:radial-gradient(130% 60% at 50% 0%,color-mix(in srgb,var(--wine) 40%,var(--bg)) 0%,var(--bg) 65%)}
.ov-inner{max-width:480px;margin:0 auto;display:grid;gap:18px}
.ov-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.live-head{text-align:center;display:grid;gap:6px;justify-items:center}
.cd{font-family:var(--f-display);font-size:68px;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
.cd.low{color:var(--bad)}
.ballot{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:grid;gap:10px}
.ballot.mine{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.ballot h3{font-size:24px;line-height:1.15}
.ballot .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ballot .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ballot .bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
.rv-hero{text-align:center;display:grid;gap:8px;justify-items:center;padding-top:6px;animation:rise .8s both}
.rv-hero h1{font-size:clamp(28px,8vw,38px);font-style:italic}
.rv-name{font-family:var(--f-display);font-size:clamp(32px,9.5vw,46px);line-height:1.05;color:var(--brass);text-wrap:balance}
.sup{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
.sup .ic{color:var(--brass);text-align:center}
.arr,.person{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.arr:last-child,.person:last-child{border-bottom:0}
.person small,.arr small{color:var(--muted);display:block;overflow-wrap:anywhere}
.livebar{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--brass)}
.livebar .grow{flex:1;min-width:0}
.livebar .cd{font-size:30px}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* Guest check (The Tab): pale green ruled restaurant check, same in both themes */
.gcheck{position:relative;background:#f2f6e9;color:#22302a;border-radius:3px;padding:16px 16px 14px;box-shadow:0 14px 34px rgba(0,0,0,.28);display:grid;gap:10px;font-size:14px;overflow:hidden}
.gc-title{font-family:var(--f-display);font-size:22px;text-align:center;letter-spacing:.2em;text-transform:uppercase;color:#9a3343}
.gc-head{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid #2f6b5a;text-align:center}
.gc-head > div{padding:4px 2px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#2f6b5a;font-weight:700}
.gc-head > div + div{border-left:1px solid #2f6b5a}
.gc-head b{display:block;font-family:var(--f-mono);font-size:15px;color:#22302a;letter-spacing:0;font-weight:500}
.gc-name{display:grid;justify-items:center;gap:1px;border-bottom:1.5px solid #2f6b5a;padding-bottom:8px}
.gc-name span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#2f6b5a;font-weight:700}
.gc-name b{font-family:var(--f-display);font-size:20px;font-weight:500}
.gc-lines{background:repeating-linear-gradient(to bottom,transparent 0 29px,#b9cdb9 29px 30px);min-height:30px}
.gc-row{display:grid;grid-template-columns:70px minmax(0,1fr) auto 22px;gap:8px;align-items:center;min-height:30px;font-size:14px}
.gc-row > span:nth-child(2){overflow-wrap:anywhere}
.gc-cat{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#2f6b5a;font-weight:700}
.gc-amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gc-muted{color:#6c7d73;font-style:italic}
.gc-x{border:0;background:none;color:#b4442f;font-size:13px;padding:0}
.gc-for{font-size:12.5px;color:#41544a}
.gc-tot{display:grid;gap:3px;border-top:1.5px solid #2f6b5a;padding-top:8px;font-size:13.5px}
.gc-tot > div{display:flex;justify-content:space-between;gap:12px}
.gc-tot > div span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gc-grand{font-weight:700;font-size:16px;border-top:3px double #2f6b5a;padding-top:6px;margin-top:3px}
.gc-bal{color:#9a3343;font-weight:700}
.gc-note{color:#b4442f;font-size:13px;font-style:italic}
.gc-section{display:grid;gap:2px;padding:6px 0;border-bottom:1px dashed #9db59f}
.gc-who{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.gc-who span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#2f6b5a;font-weight:700}
.gc-sub{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#41544a}
.gc-sub span:last-child{font-family:var(--f-mono);color:#22302a;font-weight:600;font-size:13px}
.stamp{position:absolute;right:12px;top:118px;transform:rotate(-14deg);border:3px solid currentColor;border-radius:6px;padding:3px 10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:17px;opacity:.82;z-index:1;pointer-events:none}
.stamp.sent{color:#9a6a10}.stamp.ok{color:#2f6b5a}.stamp.back{color:#b4442f}.stamp.paid{color:#2f7d48;font-size:24px}
/* Sights & Sounds gallery */
#gallery{position:fixed;inset:0;z-index:71;overflow-y:auto;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.g-hero{position:relative;border-radius:16px;overflow:hidden;padding:0;border:0;width:100%;background:var(--surface);display:block;text-align:left;color:#fff}
.g-hero img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover}
.g-hero .cap{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:grid;gap:2px}
.g-hero .cap b{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.g-hero .cap span{font-size:12px;opacity:.85}
.g-month{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--brass);margin:6px 0 -4px}
.masonry{columns:2;column-gap:8px}
@media (min-width:640px){.masonry{columns:3}}
.tile{break-inside:avoid;margin:0 0 8px;display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--surface);text-align:left;color:var(--ink)}
.tile img{display:block;width:100%;max-width:100%;height:auto}
.tile .meta{padding:7px 9px 9px;display:grid;gap:1px}
.tile .meta b{font-size:12.5px;font-weight:600;line-height:1.3}
.tile .meta span{font-size:11px;color:var(--muted)}
.strip-photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip-photos button{flex:0 0 112px;height:112px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--surface)}
.strip-photos img{width:100%;height:100%;object-fit:cover;display:block}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
/* Heading font: Nunito, bold and clear (his request, 2026-10-17: "rounder, clearer, crisper") */
.greet,.brand,.splash-title,.round .tabletop,.cd,.rv-name,.gc-title,.calc-out .pp,.i-rest,.mark .five,.fav .rank,.tip .n,.g-month,.seal{font-weight:800}
.i-host,.i-when,.i-note,.envelope .d{font-weight:600}
</style>
</head>

  if(RBY[id]) return RBY[id];
  const r = {id, google:true, placeId:id.slice(2), name:"Restaurant from Google", city:city || "Memphis", cuisine:["Restaurant"], hood:"", addr:"", price:0, flags:[], blurb:""};
  R.push(r); RBY[id] = r; return r;
}
function gApply(p, city){
  gInfo[p.placeId] = {...(gInfo[p.placeId] || {}), ...p};
  const r = gRest(p.id, city); r.name = p.name || r.name; r.addr = p.address || r.addr; r.hood = p.short || r.hood;
  r.cuisine = [p.type || "Restaurant"]; if(p.price) r.price = p.price; r.mapsUri = p.mapsUri || r.mapsUri; r.status = p.status;
  return r;
}
async function placesCall(body){
  try {
    const {data} = await sb.auth.getSession();
    const res = await fetch(SB_URL + "/functions/v1/places", {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + (data.session?.access_token || "")}, body:JSON.stringify(body)});
    return await res.json();
  } catch { return {ok:false, code:"offline"}; }
}

/* fill in the names of the Google restaurants the family has saved (live, never stored) */
async function gFillNames(){
  const need = R.filter(r => r.google && !gInfo[r.placeId] && !gLoading.has(r.placeId)).map(r => r.placeId).slice(0, 10);
  if(!need.length) return;
  need.forEach(x => gLoading.add(x));
  const d = await placesCall({action:"details", ids:need, level:"basic"});
  need.forEach(x => gLoading.delete(x));
  if(d.ok){ d.places.forEach(p => gApply(p)); redraw(); if(R.some(r => r.google && !gInfo[r.placeId])) gFillNames(); }
}
/* save a Google pick: only its ID and the city we searched */
async function gSave(pid, city){
  const r = gApply(gInfo[pid] || {placeId:pid, id:"g:" + pid}, city);
  const {error} = await sb.from("restaurants").upsert({id:r.id, place_id:pid, city:r.city, source:"google"}, {onConflict:"id", ignoreDuplicates:true});
  return !error;
}

const qOffset = {};
function questionFor(e){
  const order = st.events.filter(x => x.status !== "open" || x.id === e.id).sort((a,b) => a.date.localeCompare(b.date) || String(a.created||"").localeCompare(String(b.created||"")) || a.id.localeCompare(b.id));
  const i = Math.max(0, order.findIndex(x => x.id === e.id));
  // "Another question" takes a question as far as possible from this dinner in the cycle (about 30 dinners away, then
  // spreading outward), so it neither repeats a recent dinner's question nor spoils one of the next dinners'.
  const o = qOffset[e.id] || 0, K = [0,30,35,25,40,20,45,15,50,10,55,5];
  const k = o < K.length ? K[o] : 30 + o;
  return QUESTIONS[((i + k) * 7) % QUESTIONS.length];
}

function sundayPicks(target){
  const t = iso(target);
  const wk = Math.floor(target.getTime() / (7*DAY));
  const pool = R.filter(r => r.city === "Memphis").map(r => {
    const rs = rotationState(r.id, t);
    if(rs.state === "resting" || !meals(r).dinner || isBlocked(r.id)) return null;
    const a = avgOf(r.id);
    let s = (a ?? 3.6);
    if(rs.state === "untried") s += .9;
    if(rs.state === "returning") s += 1.2;
    if(r.flags.includes("new")) s += .6;
    if(wantOf(r.id)) s += 6;   // Want to Try comes first (his order, 2026-10-17)
    s += ((wk * 7919 + r.id.length * 104729 + r.name.charCodeAt(2)) % 97) / 97 * 1.4; // weekly shuffle
    return {r, s, rs};
  }).filter(Boolean).sort((a,b) => b.s - a.s);
  return pool.slice(0,3);
}

async function trySignIn(){
  const err = document.getElementById("si-err"); err.style.color = ""; err.textContent = ""; const name = document.getElementById("si-name").value; const pin = document.getElementById("si-pin").value.trim();

  let r;
  try {
    const res = await fetch(SB_URL + "/functions/v1/pin-signin", {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY}, body:JSON.stringify({name, pin, pin2})});
    r = await res.json();
  } catch { r = {ok:false, code:"offline"}; }
  goBtn.disabled = false;
  if(r.ok){
    const who = {id:r.member_id};
    const {error} = await sb.auth.setSession(r.session);
    if(error){ err.textContent = "Something went wrong at the table. Try again in a moment."; return; }
    st.me = who.id;
    try { await pull(); } catch { err.textContent = "Can't reach the table right now. Check your connection and try again."; st.me = null; return; }
    subscribe(); st.lastName = F(st.me).name; draft = null; keepLocal(); showGreeting(); return;
  }
  switch(r.code){
    case "no_name": err.textContent = `We couldn't find “${name.trim()}” at the table. Use your full name, or ask ${host} to add you.`; break;
    case "create":
      siMode = "create";
      document.getElementById("si-pin2-wrap").hidden = false; document.getElementById("si-pin-label").textContent = "Create a 4-digit PIN";
      document.getElementById("si-go").textContent = "Save my PIN"; err.style.color = "var(--brass)";
      err.textContent = `Welcome, ${r.first || first(name)}! Choose a PIN only you know.`; document.getElementById("si-pin2").focus(); break;
    case "mismatch": err.textContent = "Those PINs don't match. Try again."; document.getElementById("si-pin2").value = ""; break;
    case "wrong": err.textContent = `That PIN isn't right. ${r.tries_left} ${r.tries_left === 1 ? "try" : "tries"} left.`; document.getElementById("si-pin").value = ""; break;
    case "locked": err.textContent = `Too many tries. Try again in ${r.minutes} min, or ask ${host} to reset your PIN.`; document.getElementById("si-pin").value = ""; break;
    case "ip_locked": err.textContent = `Too many wrong PINs from this network. Try again in ${r.minutes} min.`; break;
    case "format": err.textContent = "Your PIN is 4 numbers."; break;
    case "offline": err.textContent = "Can't reach the table right now. Check your connection and try again."; break;
    default: err.textContent = "Something went wrong at the table. Try again in a moment.";
  }
}

function miniEvent(e){
  const r = e.chosen ? RBY[e.chosen] : null;
  const state = e.status === "open" ? `<span class="pill warn">Voting · ${Object.keys(e.votes).length}/${st.fam.length}</span>`
    : e.reservation.status === "booked" ? `<span class="pill good">Reserved</span>` : e.reservation.status === "claimed" ? `<span class="pill warn">${esc(F(e.reservation.by).name)} is booking</span>` : `<span class="pill bad">Not reserved</span>`;
  return `<button class="todo" data-act="event" data-id="${e.id}">${av(e.host)}<span style="min-width:0"><b>${esc(e.title)}</b><small>${fmtDate(e.date)} · ${fmtTime(e.time)}${r?` · ${esc(r.name)}`:""}</small><br>${state}</span><span class="chev">${I.chev}</span></button>`;
}

/* ---------- Explore ---------- */
function vExplore(){
  const u = st.ui; const t = iso(nextSunday);
  let list = R.filter(r => r.city === u.city);
  list = u.filter === "blocked" ? list.filter(r => isBlocked(r.id)) : list.filter(r => !isBlocked(r.id));
  if(u.cuisine !== "All") list = list.filter(r => r.cuisine.includes(u.cuisine));
  if(u.filter === "untried") list = list.filter(r => !lastVisit(r.id));
  if(u.filter === "new") list = list.filter(r => r.flags.includes("new"));
  if(u.filter === "favorites") list = list.filter(r => visitsOf(r.id).length >= 2);
  if(u.filter === "want") list = list.filter(r => wantOf(r.id));
  if(u.budget === "light") list = list.filter(r => r.price <= 2);
  if(u.budget === "high") list = list.filter(r => r.price >= 3);
  if(u.meal !== "any") list = list.filter(r => meals(r)[u.meal]);
  if(u.q) { const q = u.q.toLowerCase(); list = list.filter(r => (r.name+" "+r.cuisine.join(" ")+" "+r.hood).toLowerCase().includes(q)); }
  list.sort((a,b) => (avgOf(b.id)??0) - (avgOf(a.id)??0) || a.name.localeCompare(b.name));
  const total = R.filter(r => r.city === u.city).length;
  return `
  <section class="sec">
    <div class="sec-head"><h2>Explore</h2><span class="muted small num">${list.length} of ${total}</span></div>
    <div class="grid2">
      <div class="field"><label for="city">City</label><select class="input" id="city" data-change="city">${CITIES.map(c => `<option ${c===u.city?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label for="flt">Show</label><select class="input" id="flt" data-change="filter">
        ${[["all","Everything"],["untried","Not tried yet"],["new","New openings"],["favorites","Our favorites"],["want","Want to try"],["blocked","Never Again list"]].map(([k,l]) => `<option value="${k}" ${k===u.filter?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="bud">Budget</label><select class="input" id="bud" data-change="budget">
        ${[["any","Any budget"],["light","Lighter ($–$$)"],["high","High end ($$$+)"]].map(([k,l]) => `<option value="${k}" ${k===u.budget?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="meal">Meal</label><select class="input" id="meal" data-change="meal">
        ${[["any","Any meal"],["breakfast","Breakfast & brunch"],["lunch","Lunch"],["dinner","Dinner"],["dessert","Dessert & treats"]].map(([k,l]) => `<option value="${k}" ${k===u.meal?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="search">${I.search}<input class="input" id="q" type="search" placeholder="Search restaurants, cuisines, neighborhoods" value="${esc(u.q)}" data-input="q"></div>
    <div class="chips" role="group" aria-label="Cuisine">${CUISINES.map(c => `<button class="chip" data-act="cuisine" data-c="${c}" aria-pressed="${c===u.cuisine}">${c}</button>`).join("")}</div>
  </section>
  ${gBlock("explore")}
  <section class="sec" id="rlist">
    <div class="lbl">OUR LIST</div>
    ${list.length ? list.map(r => rRow(r,t)).join("") : `<div class="empty">No matches here yet. Try another cuisine or city, or search Google above.</div>`}
  </section>`;
}
function rRow(r,t){
  const v = visitsOf(r.id).length, a = avgOf(r.id), rs = rotationState(r.id, t);
  const tags = [];
  if(r.flags.includes("new")) tags.push('<span class="pill wine">New</span>');
  if(!v) tags.push('<span class="pill brass">Not tried</span>');
  if(v) tags.push(`<span class="pill">Chosen ${v}× · last ${fmtDate(lastVisit(r.id))}</span>`);
  if(rs.state === "resting") tags.push(`<span class="pill">Resting until ${fmtDate(rs.back)}</span>`);
  if(rs.state === "returning") tags.push('<span class="pill good">Back in rotation</span>');
  if(wantOf(r.id)) tags.push(`<span class="pill brass">★ Want to try · ${esc(first(F(wantOf(r.id).by)?.name || "family"))}</span>`);
  return `<button class="r-row" data-act="rest" data-rid="${r.id}">
    <h3>${esc(r.name)}</h3><span class="score">${a ? `${fmt10(a)}<span class="muted">/10</span>` : "—"}</span>
    <span class="sub">${r.cuisine.join(" · ")} · ${esc(r.hood)}<br>${costText(r)} · ${mealText(r)}</span>
    ${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}
  </button>`;
}

    </div>

    ${isBlocked(rid) ? `<div class="warnbox" style="color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)"><b>On our Never Again list.</b> “${esc(st.blocked[rid].reason || "Bad experience")}” — ${esc(first(F(st.blocked[rid].by).name))}, ${fmtDate(st.blocked[rid].date)}<br><button class="link-btn" data-act="unblock" data-rid="${rid}" style="color:inherit;text-decoration:underline">Give it another chance</button></div>` : ""}

    ${lastOrder(rid) ? `<div class="sup"><span class="ic">🍽️</span><span><b>Last time you had:</b> ${esc(lastOrder(rid).ordered)} <span class="muted">· ${fmtDate(lastOrder(rid).date)}</span></span></div>` : ""}

/* ---------- Plan ---------- */
let draft = null;
function newDraft(occ="sunday", rid=null){
  const o = OCCASIONS.find(x => x.k === occ) || OCCASIONS[0];
  draft = {type:o.k, mode:o.mode, title:o.k==="birthday"?`${first(ME().name)}'s Birthday`:o.label, date: o.k==="sunday"?iso(nextSunday):iso(add(today0,7)), time:o.k==="sunday"?"17:30":"19:00",
    dress:o.k==="sunday"?"Smart casual":o.mode==="host"?"Cocktail attire":"Casual", options: rid?[rid]:[], note:"", guests:[], q:"", cap:0, arrive:"", theme:"", gifts:"", adults:false, voteMin:10, dessert:""};
}
function vPlan(){
  if(!draft) newDraft();

  if(d.q){ const q = d.q.toLowerCase(); pool = R.filter(r => (r.name+" "+r.cuisine.join(" ")+" "+r.city).toLowerCase().includes(q)); }
  pool = pool.filter(r => (!isBlocked(r.id) && (isHost || !+d.cap || r.price <= +d.cap)) || d.options.includes(r.id));
  pool = pool.filter(r => !r.flags.includes("dessert") || d.options.includes(r.id)); // a bakery or dessert shop is a stop after dinner, not the dinner
  pool.sort((a,b) => (d.options.includes(b.id)-d.options.includes(a.id)) || (picks.includes(b.id)-picks.includes(a.id)) || a.name.localeCompare(b.name));
  const t = d.date;

const FLOURISH = `<svg class="i-flour" viewBox="0 0 150 14" aria-hidden="true"><path d="M2 7h56M92 7h56" stroke="currentColor" stroke-width=".8" fill="none"/><path d="M75 1l6 6-6 6-6-6z" fill="currentColor"/><circle cx="62" cy="7" r="1.6" fill="currentColor"/><circle cx="88" cy="7" r="1.6" fill="currentColor"/></svg>`;
const ONES = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const words = n => n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? "-" + ONES[n%10] : "");
const ORD_IRREG = {1:"first",2:"second",3:"third",5:"fifth",8:"eighth",9:"ninth",12:"twelfth"};
const ordWord = n => { if(ORD_IRREG[n]) return ORD_IRREG[n]; if(n < 20) return ONES[n] + "th"; const t = Math.floor(n/10), o = n%10;
  return o ? TENS[t] + "-" + (ORD_IRREG[o] || ONES[o] + "th") : TENS[t].replace(/y$/,"ieth"); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function formalDate(s){ const d = parse(s); return `${d.toLocaleDateString("en-US",{weekday:"long"})}, the ${ordWord(d.getDate())} of ${d.toLocaleDateString("en-US",{month:"long"})}`; }
function formalYear(s){ const y = parse(s).getFullYear(); return cap1(`two thousand ${words(y - 2000)}`.trim()); }
function formalTime(t){
  const [h,m] = t.split(":").map(Number); const hh = h % 12 || 12;
  const part = h < 12 ? "in the morning" : h < 17 ? "in the afternoon" : "in the evening";
  if(h === 12 && m === 0) return "at twelve noon";
  const clock = m === 0 ? `${ONES[hh]} o'clock` : m === 30 ? `half past ${ONES[hh]}` : m === 15 ? `quarter past ${ONES[hh]}` : m === 45 ? `quarter to ${ONES[hh % 12 + 1]}` : `${ONES[hh]} ${m < 10 ? "oh " + ONES[m] : words(m)}`;
  return `at ${clock} ${part}`;
}
function calLink(e){
  const r = RBY[e.chosen]; const [h,m] = e.time.split(":").map(Number); const d = parse(e.date);

  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.title + " · " + r.name)}&dates=${f(st0)}/${f(en)}&location=${encodeURIComponent(placeQ(r))}&details=${encodeURIComponent("Dress: " + e.dress + "\nMenu: " + menuLink(r) + (RBY[e.dessert] ? "\nDessert after: " + RBY[e.dessert].name + ", " + addrOf(RBY[e.dessert]) : ""))}`;
}

}
function personRow(kind, p){
  const lead = kind === "fam" ? av(p.id) : `<span class="avatar" style="background:var(--surface-2);color:var(--ink)">${esc((p.name||"?")[0])}</span>`;
  const sub = [kind === "contact" ? p.relation : "", p.email, p.phone, p.birthday ? "Birthday " + parse(p.birthday).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "", p.diet].filter(Boolean).join(" · ") || "No email or phone yet";
  return `<div class="person">${lead}<span style="min-width:0"><b>${esc(p.name)}</b>${kind==="fam"&&p.id===st.me?' <span class="pill brass">you</span>':""}<small>${esc(sub)}</small></span>${kind === "contact" || p.id === st.me || isAdmin() ? `<button class="btn sm ghost" data-act="person-edit" data-kind="${kind}" data-id="${p.id}">Edit</button>` : "<span></span>"}</div>`;
}

/* ---------- Sheets ---------- */
const wrap = document.getElementById("sheet-wrap"), sheet = document.getElementById("sheet");
function openSheet(html){ sheet.innerHTML = `<div class="grab"></div>${html}`; wrap.classList.toggle("stage", /data-(game|room|gstage|cinema)[\s>=]/.test(html)); wrap.classList.toggle("cinema", /data-cinema[\s>=]/.test(html)); wrap.classList.add("open"); wrap.setAttribute("aria-hidden","false"); sheet.scrollTop = 0; }
function closeSheet(){ wrap.classList.remove("open"); wrap.setAttribute("aria-hidden","true"); }
wrap.addEventListener("click", e => { if(e.target === wrap) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* The six-part guide (his standing order, 2026-10-12): tips, manual, voice, sample conversations,

   own buttons, drawn with the same styles and made untappable. */
let guidePart = "tips";
const GUIDE_PARTS = [["tips","💡","Quick tips"],["manual","📖","Manual"],["voice","🎙️","Voice"],["talk","💬","Sample conversations"],["fix","🛠️","Troubleshooting"],["can","✅","Can & cannot"]];
