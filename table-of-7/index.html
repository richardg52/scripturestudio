<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table of 7</title>
<meta name="author" content="Richard G. Clark">
<meta name="copyright" content="© 2026 Richard G. Clark. All rights reserved.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table of 7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600..900;1,600..900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: one-column phone app shell (max 480px) — sticky header, scrolling view, fixed tab bar. Evening dining room: bottle green, brass, wine. */
:root{
  --bg:#0f1c18; --surface:#15261f; --surface-2:#1c3129; --line:rgba(222,200,150,.16);
  --ink:#efe9dc; --muted:#a3b0a6; --brass:#cfab6c; --brass-ink:#1a160c; --wine:#9a3343; --wine-soft:rgba(154,51,67,.18);
  --good:#86c596; --warn:#e3b45c; --bad:#e58474; --scrim:rgba(5,10,8,.62); --card-shadow:0 10px 30px rgba(0,0,0,.28);
  --paper:#f6f1e6; --paper-ink:#2a1f14; --paper-line:#c9b083;
  --f-display:"Nunito","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#e2e8e2; --line:rgba(19,48,38,.13);
  --ink:#13261f; --muted:#56675e; --brass:#8b6a2c; --brass-ink:#fffaf0; --wine:#8e2f3c; --wine-soft:rgba(142,47,60,.10);
  --good:#2f7d48; --warn:#9a6a10; --bad:#b4442f; --scrim:rgba(10,20,16,.45); --card-shadow:0 8px 24px rgba(19,48,38,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
a{color:var(--brass)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#1d3a30 0%,#0b1512 70%);color:#efe9dc;display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));transition:opacity .7s ease}
#splash.out{opacity:0;pointer-events:none}
.mark{position:relative;width:min(220px,58vw);aspect-ratio:1;max-width:100%;margin:0 auto 28px}
.mark svg{width:100%;height:100%;overflow:visible}
.mark .ring{stroke:#cfab6c;stroke-width:1.2;fill:none;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
.mark .seat{fill:#cfab6c;opacity:0;animation:pop .5s forwards}
.mark .five{font-family:var(--f-display);font-style:italic;fill:#efe9dc;font-size:78px;opacity:0;animation:fade .9s 1.2s forwards}
.splash-title{font-family:var(--f-display);font-size:clamp(34px,10vw,48px);letter-spacing:.06em;opacity:0;animation:rise .9s 1.4s forwards}
.splash-tag{margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#cfab6c;opacity:0;animation:fade .9s 1.9s forwards}
.splash-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;color:rgba(239,233,220,.5);opacity:0;animation:fade .6s 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Seat picker / greeting ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gate-inner{width:100%;max-width:420px;display:grid;gap:18px;justify-items:center}
.round{position:relative;width:min(300px,82vw);aspect-ratio:1;max-width:100%}
.round .tabletop{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--surface-2),var(--surface));border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--brass);font-size:42px}
.round .chair{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid transparent;color:#fff;font-weight:600;font-size:20px;display:grid;place-items:center;box-shadow:var(--card-shadow);transition:transform .2s}
.round .chair:hover{transform:scale(1.07)}
.round .chair span{position:absolute;top:100%;margin-top:4px;font-size:12px;color:var(--ink);font-weight:500;white-space:nowrap}
.greet{font-family:var(--f-display);font-size:clamp(30px,8vw,40px)}
.greet em{color:var(--brass)}
#gate.greeting .gate-inner{animation:rise .7s both}
.signin{width:100%;max-width:340px;display:grid;gap:12px;text-align:left}
.pin{font-family:var(--f-mono);font-size:26px;letter-spacing:.7em;text-align:center;padding-left:.7em}
.si-err{min-height:20px;font-size:13px;color:var(--bad);text-align:center}
.round.small{width:min(190px,52vw)}
.round.small .chair{width:38px;height:38px;margin:-19px 0 0 -19px;font-size:13px;pointer-events:none}
.round.small .chair span{display:none}
.round.small .tabletop{font-size:30px}

/* ---------- App shell ---------- */
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;flex:1}
.brand i{color:var(--brass)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:11px}
.avatar.xs{width:20px;height:20px;font-size:10px}
.stack{display:inline-flex}
.stack .avatar{border:2px solid var(--surface);margin-left:-6px}
.stack .avatar:first-child{margin-left:0}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;align-content:start}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brass)}
nav.tabs .plan-btn span.disc{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;box-shadow:var(--card-shadow)}
.badge-dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--wine);color:#fff;font-size:10px;line-height:16px;font-weight:700}

/* ---------- Sections & cards ---------- */
.sec{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:22px}
.link-btn{background:none;border:0;color:var(--brass);font-weight:600;font-size:13px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.hello h1{font-size:32px;line-height:1.1}
.hello h1 em{color:var(--brass)}
.hello p{margin:6px 0 0;color:var(--muted)}
.feature{position:relative;overflow:hidden;border-radius:18px;padding:20px;background:linear-gradient(150deg,var(--wine) 0%,color-mix(in srgb,var(--wine) 55%,var(--bg)) 100%);color:#fbeff0;display:grid;gap:8px;box-shadow:var(--card-shadow)}
.feature .eyebrow{color:#f4d9a8}
.feature h3{font-size:28px;line-height:1.1}
.feature .meta{font-size:13px;opacity:.85}
.feature .why{font-size:13px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.feature .actions .btn{background:#fbeff0;color:#5a1622;border-color:transparent}
.feature .actions .btn.ghost{background:transparent;color:#fbeff0;border-color:rgba(251,239,240,.4)}
.feature .plate{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(244,217,168,.35);box-shadow:inset 0 0 0 14px rgba(244,217,168,.06)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.alt b{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.wine{background:var(--wine);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.brass{color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent)}
.pill.wine{color:#fff;background:var(--wine)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.todo .ic{width:34px;height:34px;border-radius:50%;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;flex:none}
:root .todo .ic{color:var(--bad)}
.todo b{display:block;font-weight:600}
.todo small{color:var(--muted)}
.todo .chev{margin-left:auto;color:var(--muted)}
.scroller{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-2px}
.scroller > *{scroll-snap-align:start;flex:0 0 72%}

/* ---------- Restaurant rows ---------- */
.r-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.r-row h3{font-size:18px;line-height:1.2}
.r-row .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.r-row .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.r-row .score{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--brass)}
.stars{color:var(--brass);letter-spacing:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:transparent;color:var(--brass-ink)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}

/* ---------- Events ---------- */
.event{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.event .ev-head{padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.event .ev-head .who{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.event .ev-head .who b{color:var(--ink);font-weight:600}
.event .ev-body{padding:12px 16px 16px;display:grid;gap:14px}
.event h3{font-size:22px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%;position:relative;overflow:hidden}
.opt.mine{border-color:var(--brass)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--brass) 12%,transparent);z-index:0;transition:width .4s}
.opt > *:not(.bar){position:relative;z-index:1}
.opt b{font-family:var(--f-display);font-weight:700;font-size:17px}
.opt .count{font-family:var(--f-mono);font-size:13px}
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;flex-wrap:wrap}
.strip .grow{flex:1;min-width:150px}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px}
.rsvp button[aria-pressed="true"].yes{background:var(--good);color:#0d1f14;border-color:transparent}
.rsvp button[aria-pressed="true"].maybe{background:var(--warn);color:#241a05;border-color:transparent}
.rsvp button[aria-pressed="true"].no{background:var(--bad);color:#2a0d08;border-color:transparent}
.guest{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guest .grow{flex:1;min-width:120px}
.hands{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.hands[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.divider{height:1px;background:var(--line)}

/* ---------- Invitation: formal stationery, same paper in both themes ---------- */
.invite{background:linear-gradient(180deg,#fcf9f1 0%,#f3ebda 100%);color:var(--paper-ink);border-radius:3px;padding:38px 26px 30px;text-align:center;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.28);display:grid;gap:12px;justify-items:center}
.invite::before{content:"";position:absolute;inset:9px;border:1px solid var(--paper-line);pointer-events:none}
.invite::after{content:"";position:absolute;inset:14px;border:.5px solid rgba(201,176,131,.55);pointer-events:none}
.invite > *{position:relative;z-index:1}
.i-mono{width:60px;height:60px;border-radius:50%;border:1px solid #b08d4c;box-shadow:inset 0 0 0 3px #fcf9f1,inset 0 0 0 4px rgba(176,141,76,.5);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:22px;color:#8a6a2c}
.i-caps{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#8a6a2c;font-weight:600;max-width:30ch;line-height:1.7}
.i-script{font-family:var(--f-script);font-size:38px;line-height:1.05;color:#5a1622;font-weight:400}
.i-title{font-family:var(--f-display);font-size:26px;line-height:1.15;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-wrap:balance;max-width:16ch}
.i-host{font-family:var(--f-display);font-style:italic;font-size:16px;color:#5b4a36}
.i-flour{width:150px;height:14px;color:#b08d4c}
.i-when{font-family:var(--f-display);font-size:17px;line-height:1.55}
.i-when em{display:block;font-size:14px;color:#5b4a36}
.i-rest{font-family:var(--f-display);font-size:23px;letter-spacing:.07em;text-transform:uppercase;line-height:1.2;text-wrap:balance}
.i-addr{font-size:13px;color:#5b4a36;margin-top:-6px}
.i-grid{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:10px 0}
.i-grid > div{display:grid;gap:3px;font-size:12.5px;padding:0 4px;align-content:start}
.i-grid > div + div{border-left:1px solid var(--paper-line)}
.i-grid span{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8a6a2c;font-weight:700}
.i-note{font-family:var(--f-display);font-style:italic;font-size:15.5px;color:#5b4a36;max-width:30ch;line-height:1.5}
.i-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.i-links a{font-size:12px;font-weight:600;letter-spacing:.04em;color:#5a1622;border:1px solid #c9b083;border-radius:999px;padding:7px 13px;text-decoration:none;background:rgba(255,255,255,.4)}
.i-dress{font-size:12px;font-style:italic;color:#5b4a36;margin-top:-4px}
.i-req{display:grid;gap:3px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a2c;font-weight:700;line-height:1.5}
.i-reply{font-family:var(--f-script);font-size:24px;color:#5a1622;line-height:1.2}

/* envelope teaser in the feed */
.envelope{position:relative;border-radius:4px;background:#efe4cf;color:#2a1f14;padding:0 18px 18px;text-align:center;overflow:hidden;display:grid;gap:6px;justify-items:center;border:1px solid #d9c6a0;width:100%;box-shadow:var(--card-shadow)}
.envelope .flap{position:absolute;inset:0 0 auto;height:74px;background:#e5d4b4;clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:relative;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8455a,#7d1e2e 70%);color:#f4d9a8;font-family:var(--f-display);font-style:italic;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);margin-top:48px}
.envelope .from{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#8a6a2c;font-weight:700;margin-top:6px}
.envelope .t{font-family:var(--f-script);font-size:30px;color:#5a1622;line-height:1.1}
.envelope .d{font-family:var(--f-display);font-size:15px}

.radar{display:grid;gap:8px;padding:16px;border-radius:16px;border:1px dashed var(--brass);background:color-mix(in srgb,var(--brass) 6%,var(--surface))}

/* ---------- Sheet ---------- */
#sheet-wrap{position:fixed;inset:0;z-index:85;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}

.sheet{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;gap:16px;align-content:start}

.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:26px;flex:1;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.review{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--surface)}
.review .top{display:flex;align-items:center;gap:8px;font-size:13px}
.review p{margin:0;font-size:14px}
.crit{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.dots.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots.ten button{width:auto;aspect-ratio:1;height:auto;min-width:0;padding:0}
.dots button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.calc-out{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--surface);font-size:14px}
.calc-out .line{display:flex;justify-content:space-between;gap:12px}
.calc-out .total{font-size:18px;font-weight:700;border-top:1px dashed var(--line);padding-top:8px}

.wine{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--wine-soft);border:1px solid color-mix(in srgb,var(--wine) 30%,transparent)}

.tip{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.tip .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-style:italic}

.tip b{font-weight:600}
.ledger-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger-row:last-child{border-bottom:0}
.fav{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fav:last-child{border-bottom:0}
.fav .rank{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--brass);text-align:center}

.warnbox{padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pick-list{display:grid;gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:95;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

.proto{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px}

#host{z-index:71}

/* st → server: only what changed. Photos and card pictures are uploaded before their rows. */
let syncing = Promise.resolve(), syncQueued = false;
function queueSync(){ if(syncQueued) return; syncQueued = true; syncing = syncing.then(() => { syncQueued = false; return syncNow(); }); }
const toBlob = async dataUrl => (await fetch(dataUrl)).blob();
async function syncNow(){
  if(!FAMILY || !snap) return;
  try {
    for(const p of st.photos) if(!p.path && p.data?.startsWith("data:")){ const path = `${FAMILY}/${p.id}.jpg`;
      const {error} = await sb.storage.from("media").upload(path, await toBlob(p.data), {contentType:"image/jpeg", upsert:false}); if(error) throw error; p.path = path; }
    for(const c of st.cards) if(c.upload?.startsWith("data:") && !c.uploadPath){ const path = `${FAMILY}/cards/${c.id}.jpg`;
      const {error} = await sb.storage.from("media").upload(path, await toBlob(c.upload), {contentType:"image/jpeg", upsert:false}); if(error) throw error; c.uploadPath = path; }
    const now = rowsOf(st);
    for(const t of ORDER){
      const ins = [];
      for(const [k, row] of now[t]){ const old = snap[t].get(k);
        if(!old){ ins.push(row); continue; }
        const ch = Object.fromEntries(Object.keys(row).filter(c => !same(row[c], old[c])).map(c => [c, row[c]]));
        if(Object.keys(ch).length){ const m = Object.fromEntries(PK[t].map(c => [c, row[c]]));
          const {error, count} = await sb.from(t).update(ch, {count:"exact"}).match(m); if(error) throw error; if(!count) throw new Error("refused"); } }
      if(ins.length){ const {error} = await sb.from(t).insert(ins); if(error) throw error; }
    }
    for(const t of [...ORDER].reverse()) for(const [k, old] of snap[t]) if(!now[t].has(k)){
      const m = Object.fromEntries(PK[t].map(c => [c, old[c]]));
      const {error} = await sb.from(t).delete().match(m); if(error) throw error;
      if(t === "media" && old.storage_path) await sb.storage.from("media").remove([old.storage_path]);
    }
    snap = now;
  } catch(err){
    const msg = String(err?.message || "");
    toast(/^(Only|This|That|The ballot|The host)/.test(msg) ? msg : msg === "refused" ? "That change isn't yours to make. Showing the table as it is." : "Couldn't save that. Showing the table as it is.");
    await refresh(true);
  }
}

/* 90-day rotation: a restaurant chosen within 90 days of the target Sunday is resting. */
const ROTATION = 90;
function rotationState(rid, target){
  const lv = lastVisit(rid); if(!lv) return {state:"untried"};
  const gap = daysBetween(lv, target);
  if(gap < ROTATION) return {state:"resting", back: iso(add(parse(lv), ROTATION))};
  if(gap < ROTATION + 30) return {state:"returning"};
  return {state:"eligible"};
}
function sundayPicks(target){
  const t = iso(target);
  const wk = Math.floor(target.getTime() / (7*DAY));
  const pool = R.filter(r => r.city === "Memphis").map(r => {
    const rs = rotationState(r.id, t);
    if(rs.state === "resting" || !meals(r).dinner || isBlocked(r.id)) return null;
    const a = avgOf(r.id);
    let s = (a ?? 3.6);
    if(rs.state === "untried") s += .9;
    if(rs.state === "returning") s += 1.2;
    if(r.flags.includes("new")) s += .6;
    s += ((wk * 7919 + r.id.length * 104729 + r.name.charCodeAt(2)) % 97) / 97 * 1.4; // weekly shuffle
    return {r, s, rs};
  }).filter(Boolean).sort((a,b) => b.s - a.s);
  return pool.slice(0,3);
}
const pendingFor = id => {
  const out = [];

    if(e.mode === "vote" && e.status === "open" && !e.votes[id]) out.push({e, kind:"vote"});
    if(!e.rsvp[id] && e.host !== id) out.push({e, kind:"rsvp"});

    if(e.status === "set" && e.reservation.status === "none") out.push({e, kind:"res"});

};

      <div class="field"><label for="si-pin" id="si-pin-label">PIN</label><input class="input pin" id="si-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="••••" required></div>
      <div class="field" id="si-pin2-wrap" hidden><label for="si-pin2">Type the same PIN again</label><input class="input pin" id="si-pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" placeholder="••••"></div>
      <div class="si-err" id="si-err" role="alert">${esc(msg)}</div>

  </div>`;
  const f = document.getElementById("signin");
  (st.lastName ? document.getElementById("si-pin") : document.getElementById("si-name")).focus();
  document.getElementById("si-name").addEventListener("input", () => { if(siMode === "create"){ siMode = "signin"; document.getElementById("si-pin2-wrap").hidden = true; document.getElementById("si-pin-label").textContent = "PIN"; document.getElementById("si-go").textContent = "Sign in"; } });
  f.addEventListener("submit", async ev2 => { ev2.preventDefault(); await trySignIn(); });
}
async function trySignIn(){
  const err = document.getElementById("si-err"); err.style.color = ""; err.textContent = ""; const name = document.getElementById("si-name").value; const pin = document.getElementById("si-pin").value.trim();
  const host = first(F(ADMIN).name);
  if(!name.trim()){ err.textContent = "Type your full name."; return; }
  if(!/^\d{4}$/.test(pin)){ err.textContent = "Your PIN is 4 numbers."; return; }
  const creating = siMode === "create";
  const pin2 = creating ? document.getElementById("si-pin2").value.trim() : null;
  if(creating && !pin2){ err.textContent = "Type the same PIN again."; document.getElementById("si-pin2").focus(); return; }
  const goBtn = document.getElementById("si-go"); goBtn.disabled = true;
  let r;
  try {
    const res = await fetch(SB_URL + "/functions/v1/pin-signin", {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY}, body:JSON.stringify({name, pin, pin2})});
    r = await res.json();
  } catch { r = {ok:false, code:"offline"}; }
  goBtn.disabled = false;
  if(r.ok){
    const who = {id:r.member_id};
    const {error} = await sb.auth.setSession(r.session);
    if(error){ err.textContent = "Something went wrong at the table. Try again in a moment."; return; }
    st.me = who.id;
    try { await pull(); } catch { err.textContent = "Can't reach the table right now. Check your connection and try again."; st.me = null; return; }
    subscribe(); st.lastName = F(st.me).name; draft = null; keepLocal(); showGreeting(); return;
  }
  switch(r.code){
    case "no_name": err.textContent = `We couldn't find “${name.trim()}” at the table. Use your full name, or ask ${host} to add you.`; break;
    case "create":
      siMode = "create";
      document.getElementById("si-pin2-wrap").hidden = false; document.getElementById("si-pin-label").textContent = "Create a 4-digit PIN";
      document.getElementById("si-go").textContent = "Save my PIN"; err.style.color = "var(--brass)";
      err.textContent = `Welcome, ${r.first || first(name)}! Choose a PIN only you know.`; document.getElementById("si-pin2").focus(); break;
    case "mismatch": err.textContent = "Those PINs don't match. Try again."; document.getElementById("si-pin2").value = ""; break;
    case "wrong": err.textContent = `That PIN isn't right. ${r.tries_left} ${r.tries_left === 1 ? "try" : "tries"} left.`; document.getElementById("si-pin").value = ""; break;
    case "locked": err.textContent = `Too many tries. Try again in ${r.minutes} min, or ask ${host} to reset your PIN.`; document.getElementById("si-pin").value = ""; break;
    case "ip_locked": err.textContent = `Too many wrong PINs from this network. Try again in ${r.minutes} min.`; break;
    case "format": err.textContent = "Your PIN is 4 numbers."; break;
    case "offline": err.textContent = "Can't reach the table right now. Check your connection and try again."; break;
    default: err.textContent = "Something went wrong at the table. Try again in a moment.";
  }
}

const FLOURISH = `<svg class="i-flour" viewBox="0 0 150 14" aria-hidden="true"><path d="M2 7h56M92 7h56" stroke="currentColor" stroke-width=".8" fill="none"/><path d="M75 1l6 6-6 6-6-6z" fill="currentColor"/><circle cx="62" cy="7" r="1.6" fill="currentColor"/><circle cx="88" cy="7" r="1.6" fill="currentColor"/></svg>`;
const ONES = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const words = n => n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? "-" + ONES[n%10] : "");
const ORD_IRREG = {1:"first",2:"second",3:"third",5:"fifth",8:"eighth",9:"ninth",12:"twelfth"};
const ordWord = n => { if(ORD_IRREG[n]) return ORD_IRREG[n]; if(n < 20) return ONES[n] + "th"; const t = Math.floor(n/10), o = n%10;
  return o ? TENS[t] + "-" + (ORD_IRREG[o] || ONES[o] + "th") : TENS[t].replace(/y$/,"ieth"); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function formalDate(s){ const d = parse(s); return `${d.toLocaleDateString("en-US",{weekday:"long"})}, the ${ordWord(d.getDate())} of ${d.toLocaleDateString("en-US",{month:"long"})}`; }
function formalYear(s){ const y = parse(s).getFullYear(); return cap1(`two thousand ${words(y - 2000)}`.trim()); }
function formalTime(t){
  const [h,m] = t.split(":").map(Number); const hh = h % 12 || 12;
  const part = h < 12 ? "in the morning" : h < 17 ? "in the afternoon" : "in the evening";
  if(h === 12 && m === 0) return "at twelve noon";
  const clock = m === 0 ? `${ONES[hh]} o'clock` : m === 30 ? `half past ${ONES[hh]}` : m === 15 ? `quarter past ${ONES[hh]}` : m === 45 ? `quarter to ${ONES[hh % 12 + 1]}` : `${ONES[hh]} ${m < 10 ? "oh " + ONES[m] : words(m)}`;
  return `at ${clock} ${part}`;
}
function calLink(e){
  const r = RBY[e.chosen]; const [h,m] = e.time.split(":").map(Number); const d = parse(e.date);

}

    ${inviteCard(e)}

/* ---------- Feed ---------- */
function vFeed(){
  const active = st.events.filter(e => e.status !== "done" && canSee(e)).sort((a,b) => a.date.localeCompare(b.date));
  const past = st.events.filter(e => e.status === "done" && canSee(e)).sort((a,b) => b.date.localeCompare(a.date));
  return `
  <section class="sec"><div class="sec-head"><h2>The Feed</h2><span class="muted small">${active.length} upcoming</span></div>
    ${active.length ? active.map(eventCard).join("") : `<div class="empty">Nothing on the calendar. Start one from <b>Plan</b>.</div>`}
  </section>
  <section class="sec"><div class="sec-head"><h2>Enjoyed together</h2></div>
    ${past.map(e => pastCard(e)).join("") || `<div class="empty">After your first dinner, memories land here.</div>`}
  </section>`;
}
function eventCard(e){
  const host = F(e.host); const isHost = e.host === st.me;
  const occ = (OCCASIONS.find(o => o.k === e.type) || {}).label;
  let body = "";
  if(e.status === "open"){
    const tally = {}; e.options.forEach(o => tally[o] = []); Object.entries(e.votes).forEach(([m,o]) => tally[o] && tally[o].push(m));
    const n = Object.keys(e.votes).length;
    const lead = Math.max(...Object.values(tally).map(a => a.length));
    const leaders = e.options.filter(o => tally[o].length === lead && lead > 0);
    body += `<div class="sec" style="gap:8px">${e.options.map(o => { const r = RBY[o]; const mine = e.votes[st.me] === o;
      return `<button class="opt ${mine?"mine":""}" data-act="vote" data-id="${e.id}" data-rid="${o}"><span class="bar" style="width:${n?tally[o].length/st.fam.length*100:0}%"></span><span><b>${esc(r.name)}</b><br><span class="small muted">${r.cuisine[0]} · ${$(r.price)}${mine?" · your vote":""}</span></span><span style="display:grid;justify-items:end;gap:4px"><span class="count">${tally[o].length}</span><span class="stack">${tally[o].map(m => av(m,"xs")).join("")}</span></span></button>`; }).join("")}</div>
      <div class="strip"><span class="grow">${n}/${st.fam.length} voted${leaders.length>1?` · tie between ${leaders.map(o=>esc(RBY[o].name)).join(" & ")} — ${esc(host.name)} breaks it`:""}</span>
      ${isHost ? `<button class="btn sm primary" data-act="lock" data-id="${e.id}" ${lead?"":"disabled"}>Lock in ${leaders.length===1?esc(RBY[leaders[0]].name.split(" ")[0]):"winner"}</button>` : `<span class="muted">Host locks it in</span>`}</div>`;
  } else {
    body += envelope(e);
  }
  // reservation
  const res = e.reservation;
  if(e.status === "set"){
    const r = RBY[e.chosen];
    body += res.status === "none" ? `<div class="strip"><span class="pill bad">Not reserved</span><span class="grow">Claim it so no one double-books.</span><button class="btn sm" data-act="res-claim" data-id="${e.id}">I'll book it</button></div>`
      : res.status === "claimed" ? `<div class="strip"><span class="pill warn">Booking</span><span class="grow"><b>${esc(F(res.by).name)}</b> is calling ${esc(r.name)} now. Please don't book.${res.by===st.me && dietLine(e) ? `<br><b>Tell them:</b> ${esc(dietLine(e))}` : ""}</span>${res.by===st.me?`<button class="btn sm primary" data-act="res-book" data-id="${e.id}">Mark booked</button><button class="btn sm ghost" data-act="res-release" data-id="${e.id}">Release</button>`:""}</div>`
      : `<div class="strip"><span class="pill good">Reserved</span><span class="grow">by ${esc(F(res.by).name)}${res.conf?` · conf <span class="num">${esc(res.conf)}</span>`:""} · party of ${partySize(e)}</span></div>`;
  }
  // rsvp
  const my = e.rsvp[st.me];
  const counts = {yes:0,maybe:0,no:0}; Object.values(e.rsvp).forEach(v => counts[v]++);
  body += `<div class="sec" style="gap:8px"><div class="lbl">ARE YOU COMING? <span class="muted" style="font-weight:400">· ${counts.yes} yes · ${counts.maybe} maybe · ${counts.no} can't</span></div>
    <div class="rsvp">${[["yes","I'll be there"],["maybe","Maybe"],["no","Can't make it"]].map(([k,l]) => `<button class="${k}" data-act="rsvp" data-id="${e.id}" data-v="${k}" aria-pressed="${my===k}">${l}</button>`).join("")}</div>
    <div class="stack">${st.fam.filter(f => e.rsvp[f.id]==="yes").map(f => av(f.id,"sm")).join("")}</div></div>`;
  // guests
  if(e.guests.length){
    body += `<div class="divider"></div><div class="sec" style="gap:10px"><div class="lbl">GUEST REQUESTS · ${majority()} HANDS NEEDED</div>${e.guests.map(g => { const ok = guestApproved(g); const up = g.hands.includes(st.me);
      return `<div class="guest"><span class="grow"><b>${esc(g.name)}</b><br><span class="small muted">asked by ${esc(F(g.by).name)}</span></span><span class="stack">${g.hands.map(m => av(m,"xs")).join("")}</span>${ok?`<span class="pill good">Welcome ✓</span>`:`<button class="hands" data-act="hand" data-id="${e.id}" data-g="${g.id}" aria-pressed="${up}">✋ ${g.hands.length}/${majority()}</button>`}</div>`; }).join("")}</div>`;
  }
  if(e.status === "set"){
    const ar = st.arrivals[e.id] || {}; const here = Object.values(ar).filter(a => a.s === "here").length;
    body += `<div class="actions"><button class="btn primary" data-act="reveal" data-id="${e.id}">Open dinner card${here?` · ${here} arrived`:""}</button>
      <button class="btn sm wine" data-act="tab" data-id="${e.id}">The Tab</button><a class="btn sm" href="${mailInvite(e)}">Email invitation</a><button class="btn sm ghost" data-act="copy-invite" data-id="${e.id}">Copy text</button></div>`;
  }
  body += `<div class="actions" style="margin-top:2px">
    ${e.status==="open"?`<button class="btn wine" data-act="live" data-id="${e.id}">${e.voteEnds?`<span class="dotlive"></span> Join live vote`:`Start ${voteMin(e)}-minute vote`}</button>`:""}
    <button class="btn sm" data-act="ask-guest" data-id="${e.id}">+ Ask to bring a guest</button>
    ${e.status==="set"?`<button class="btn sm" data-act="concierge" data-id="${e.id}">Concierge &amp; tip</button><button class="btn sm wine" data-act="wrap" data-id="${e.id}">We dined — wrap up</button>`:""}
    ${isAdmin()?`<button class="btn sm ghost" data-act="ev-people" data-id="${e.id}">Who's invited</button>`:""}
    ${isHost?`<button class="btn sm ghost" data-act="cancel" data-id="${e.id}">Cancel</button>`:""}
  </div>`;
  return `<article class="event" id="ev-${e.id}">
    <div class="ev-head">${av(e.host)}<span class="who"><b>${esc(host.name)}</b> · ${occ}${e.mode==="vote"?" · family vote":" · host's choice"}<br>${fmtLong(e.date)} · ${fmtTime(e.time)}</span>${e.status==="open"?'<span class="pill warn">Voting</span>':""}</div>
    <div class="ev-body">${e.status==="open"?`<h3>${esc(e.title)}</h3>${e.note?`<p class="small muted" style="margin:-8px 0 0">${esc(e.note)}</p>`:""}<div class="small muted" style="margin-top:-8px">Dress: ${esc(e.dress)}</div>`:""}${body}</div>
  </article>`;
}
const partySize = e => st.fam.filter(f => e.rsvp[f.id] === "yes").length + e.guests.filter(guestApproved).length;
function pastCard(e){

    ${photoGrid(e.id)}

    <div style="display:flex;gap:8px"><input class="input" id="note-${e.id}" placeholder="Share a moment from the night"><button class="btn" data-act="note" data-id="${e.id}">Post</button></div>
  </article>`;
}
const ledgerText = l => l.mode === "tab" ? `${F(l.payer).name} paid one check; everyone paid back` : l.mode === "all" ? `${F(l.payer).name} treated everyone` : l.mode === "for" ? `${F(l.payer).name} paid for ${F(l.forWhom).name}` : l.mode === "split" ? "Split evenly" : "Everyone paid their own";

/* ---------- Our Table: favorites, ledger ---------- */
function vTable(){
  const counts = {}; st.visits.forEach(v => { counts[v.rid] = (counts[v.rid]||0) + 1; });
  const favs = Object.entries(counts).sort((a,b) => b[1]-a[1] || (lastVisit(b[0])||"").localeCompare(lastVisit(a[0])||"")).slice(0,8);
  const maxC = favs[0]?.[1] || 1;
  const led = [...st.ledger].sort((a,b) => b.date.localeCompare(a.date));
  const lastTreat = {}; st.fam.forEach(f => lastTreat[f.id] = null);
  led.forEach(l => { if(l.mode === "all" && l.payer && !lastTreat[l.payer]) lastTreat[l.payer] = l.date; });
  const treatCount = id => st.ledger.filter(l => l.mode==="all" && l.payer===id).length;
  const next = [...st.fam].sort((a,b) => (lastTreat[a.id]||"0000").localeCompare(lastTreat[b.id]||"0000"))[0];
  const myReviews = st.reviews.filter(r => r.by === st.me).length;
  return `
  <section class="sec"><div class="eyebrow">Our Table</div><h1 style="font-size:30px">Favorites, tabs &amp; memories</h1></section>
  ${isAdmin() ? `<button class="todo" data-act="host" style="border-color:var(--brass)"><span class="ic" style="color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent)">✓</span><span><b>Host controls</b><small>${queueCount() ? queueCount() + " waiting for approval · " : ""}Approve photos and cards, pause members, delete posts</small></span><span class="chev">${I.chev}</span></button>` : ""}
  <section class="card">
    <div class="sec-head"><h2 style="font-size:20px">Our favorites</h2><span class="small muted">by times chosen</span></div>
    ${favs.map(([rid,c],i) => `<button class="fav" data-act="rest" data-rid="${rid}" style="background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%;color:inherit"><span class="rank">${i+1}</span><span style="min-width:0"><b>${esc(RBY[rid].name)}</b><span class="small muted">Last ${fmtDate(lastVisit(rid))}${avgOf(rid)?` · ${fmt10(avgOf(rid))}/10`:""}</span><div class="meter" style="margin-top:6px"><i style="width:${c/maxC*100}%"></i></div></span><span class="num">${c}×</span></button>`).join("")}
  </section>
  <section class="card">
    <div class="sec-head"><h2 style="font-size:20px">Who's paid</h2></div>
    <div class="strip"><span class="grow">Hasn't treated in a while: <b>${esc(next.name)}</b></span><span class="small muted">a nudge, not a rule</span></div>
    ${led.map(l => `<div class="ledger-row">${l.payer?av(l.payer,"sm"):'<span class="avatar sm" style="background:var(--surface-2);color:var(--ink)">½</span>'}<span style="min-width:0"><b>${esc(RBY[l.rid].name)}</b><br><span class="small muted">${fmtDate(l.date)} · ${esc(ledgerText(l))}</span></span><span class="num">${money(l.amount)}</span></div>`).join("")}
    <div class="lbl" style="margin-top:6px">TREATS SO FAR</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px">${st.fam.map(f => `<span style="display:flex;align-items:center;gap:6px">${av(f.id,"sm")}<span class="num">${treatCount(f.id)}</span></span>`).join("")}</div>
  </section>
  <button class="g-hero" data-act="gallery" style="${st.photos.some(approved) ? "" : "padding:22px;background:var(--surface);border:1px solid var(--line);color:var(--ink)"}">${st.photos.some(approved) ? `<img src="${st.photos.filter(approved).sort((a,b)=>b.t-a.t)[0].data}" alt=""><span class="cap"><span>${st.photos.filter(approved).length} moments</span><b>Sights &amp; Sounds</b><span>Open the family gallery</span></span>` : `<span class="eyebrow">Gallery</span><br><b style="font-family:var(--f-display);font-weight:700;font-size:22px">Sights &amp; Sounds</b><br><span class="small muted">Food, places and family photos, all in one album.</span>`}</button>
  <section class="card">
    <div class="sec-head"><h2 style="font-size:20px">Never Again</h2><span class="small muted num">${Object.keys(st.blocked).length}</span></div>
    <p class="small muted" style="margin:0">Places with a bad experience. They're hidden from recommendations, votes and planning.</p>
    <div>${Object.entries(st.blocked).map(([rid,b]) => `<div class="person"><span class="avatar" style="background:var(--surface-2);color:var(--bad)">✕</span><span style="min-width:0"><b>${esc(RBY[rid].name)}</b><small>“${esc(b.reason || "Bad experience")}” — ${esc(first(F(b.by).name))}, ${fmtDate(b.date)}</small></span><button class="btn sm ghost" data-act="unblock" data-rid="${rid}">Remove</button></div>`).join("") || `<div class="empty">Nothing here, and let's keep it that way.</div>`}</div>
  </section>
  <section class="card">
    <div class="sec-head"><h2 style="font-size:20px">Family at the table</h2><span class="small muted num">${st.fam.length} seats</span></div>
    <div>${st.fam.map(f => personRow("fam", f)).join("")}</div>
    ${isAdmin() ? `<button class="btn sm" data-act="person-new" data-kind="fam" style="justify-self:start">+ Add a seat</button>` : `<p class="small muted" style="margin:0">Only ${esc(first(F(ADMIN).name))} can add or remove seats.</p>`}
  </section>
  <section class="card">
    <div class="sec-head"><h2 style="font-size:20px">Contacts &amp; guests</h2><span class="small muted num">${st.contacts.length}</span></div>
    <p class="small muted" style="margin:0">Friends and extended family you invite often. They get the invitation email once the family raises hands.</p>
    <div>${st.contacts.map(c => personRow("contact", c)).join("") || `<div class="empty">No contacts yet.</div>`}</div>
    <button class="btn sm" data-act="person-new" data-kind="contact" style="justify-self:start">+ Add a contact</button>
  </section>
  <section class="card">
    <p class="small muted" style="margin:0">You've written ${myReviews} review${myReviews===1?"":"s"}.</p>
    <div class="actions"><button class="btn sm" data-act="tips">Guide: tips, manual, troubleshooting</button></div>
  </section>`;
}
function personRow(kind, p){
  const lead = kind === "fam" ? av(p.id) : `<span class="avatar" style="background:var(--surface-2);color:var(--ink)">${esc((p.name||"?")[0])}</span>`;
  const sub = [kind === "contact" ? p.relation : "", p.email, p.phone, p.birthday ? "Birthday " + parse(p.birthday).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "", p.diet].filter(Boolean).join(" · ") || "No email or phone yet";
  return `<div class="person">${lead}<span style="min-width:0"><b>${esc(p.name)}</b>${kind==="fam"&&p.id===st.me?' <span class="pill brass">you</span>':""}<small>${esc(sub)}</small></span>${kind === "contact" || p.id === st.me || isAdmin() ? `<button class="btn sm ghost" data-act="person-edit" data-kind="${kind}" data-id="${p.id}">Edit</button>` : "<span></span>"}</div>`;
}

/* The six-part guide (his standing order, 2026-10-12): tips, manual, voice, sample conversations,
   troubleshooting, can & cannot. Every line is read off this file; the button pictures are the app's
   own buttons, drawn with the same styles and made untappable. */
let guidePart = "tips";

/* Lock-screen notifications. Every alert the app writes is also sent to the phones its person has
   turned on (server: functions/push). iPhone allows this only for apps added to the Home Screen. */
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
async function pushCall(body){
  try { const {data} = await sb.auth.getSession();
    const r = await fetch(SB_URL + "/functions/v1/push", {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + (data.session?.access_token || "")}, body:JSON.stringify(body)});
    return await r.json(); } catch { return {ok:false, code:"offline"}; }
}
async function pushPanel(){
  const stEl = document.getElementById("push-state"), bEl = document.getElementById("push-btns"); if(!stEl) return;
  const say = (t, btns = "") => { stEl.textContent = t; bEl.innerHTML = btns; };
  if(!pushOK()){
    if(isIOS() && !isStandalone()) return say("On iPhone, notifications work once Table of 7 is on your Home Screen: tap Share (the square with the arrow), then Add to Home Screen. Open Table of 7 from the Home Screen and come back here.");
    return say("This browser can't show notifications. On iPhone, add Table of 7 to your Home Screen first.");
  }
  if(Notification.permission === "denied") return say("Notifications are blocked for Table of 7 on this phone. Turn them on in your phone's Settings, then come back here.");
  const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
  if(sub) say("On. Votes, invitations, check-ins and The Tab reach this phone even when the app is closed.", `<button class="btn sm" data-act="push-test">Send me a test</button><button class="btn sm ghost" data-act="push-off">Turn off</button>`);
  else say("Off. Turn on to hear about votes, invitations, check-ins and The Tab even when the app is closed.", `<button class="btn sm primary" data-act="push-on">Turn on notifications</button>`);
}
async function pushOn(){
  const perm = await Notification.requestPermission();
  if(perm !== "granted"){ toast("Notifications weren't allowed on this phone"); pushPanel(); return; }
  const k = await pushCall({action:"key"});
  if(!k.ok){ toast("Can't reach the table right now. Try again."); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(k.key)});
  const j = sub.toJSON();
  const {error} = await sb.from("push_subscriptions").upsert({member_id:st.me, endpoint:j.endpoint, keys:j.keys, user_agent:navigator.userAgent.slice(0, 200)}, {onConflict:"endpoint"});
  if(error){ await sub.unsubscribe(); toast("Couldn't turn notifications on. Try again."); pushPanel(); return; }
  await pushCall({action:"test"});
  toast("Notifications are on. A test is on its way."); pushPanel();
}
async function pushOff(){
  const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
  if(sub){ await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  toast("Notifications are off on this phone"); pushPanel();
}

async function pinChangeGo(){
  const v = id => document.getElementById(id).value.trim(), err = document.getElementById("pc-err");
  const o = v("pc-old"), n1 = v("pc-new"), n2 = v("pc-new2");
  if(![o, n1].every(x => /^\d{4}$/.test(x))){ err.textContent = "PINs are 4 numbers."; return; }
  if(n1 !== n2){ err.textContent = "The new PINs don't match."; document.getElementById("pc-new2").value = ""; return; }
  const {data, error} = await sb.rpc("change_my_pin", {old_pin:o, new_pin:n1});
  if(error || !data){ err.textContent = "Can't reach the table right now. Try again."; return; }
  if(data.ok){ closeSheet(); toast("Your new PIN is set"); return; }
  if(data.code === "wrong"){ err.textContent = `Your current PIN isn't right. ${data.tries_left} ${data.tries_left === 1 ? "try" : "tries"} left.`; document.getElementById("pc-old").value = ""; return; }
  if(data.code === "locked"){ err.textContent = `Too many tries. Locked for ${data.minutes} min.`; return; }
  if(data.code === "signed_out"){ lockApp("Please sign in again."); return; }
  err.textContent = "PINs are 4 numbers.";
}

function downscale(file){
  return new Promise((ok, bad) => { const rd = new FileReader();
    rd.onload = () => { const img = new Image();
      img.onload = () => { const k = Math.min(1, 1000 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .72)); };
      img.onerror = bad; img.src = rd.result; };
    rd.onerror = bad; rd.readAsDataURL(file); });
}

      <div class="calc-out" id="c-out"></div>
      <button class="btn wine block" data-act="tab" data-id="${e.id}">Each person pays for what they ate? Open The Tab</button>
      <p class="small muted" style="margin:0">Tip is figured on the pre-tax subtotal. Many restaurants add 18–20% automatically for parties of 6 or more, so check the bill before tipping again.</p>
    </div>`);
  sheet.dataset.svc = "4";
  calc();
}
function calc(){
  const out = document.getElementById("c-out"); if(!out) return;
  const sub = parseFloat(document.getElementById("c-sub").value) || 0;
  const tax = (parseFloat(document.getElementById("c-tax").value) || 0) / 100;
  const n = Math.max(1, parseInt(document.getElementById("c-diners").value) || 1);
  const auto = document.getElementById("c-auto").value === "1";
  const svc = +sheet.dataset.svc;
  const pct = auto ? 0 : TIP_BY_SERVICE[svc];
  const labels = {1:"Poor service → 12%",2:"Below par → 15%",3:"Solid → 18%",4:"Great service → 20%",5:"Exceptional → 22%"};
  document.getElementById("c-svc-note").textContent = auto ? "Gratuity included — add extra only for something special." : labels[svc];
  const t = sub*tax, tip = sub*pct/100, total = sub + t + tip;
  out.innerHTML = `<div class="line"><span>Subtotal</span><span class="num">${money(sub)}</span></div>
    <div class="line"><span>Tax</span><span class="num">${money(t)}</span></div>
    <div class="line"><span>Tip (${pct}%)</span><span class="num">${money(tip)}</span></div>
    <div class="line total"><span>Total</span><span class="num">${money(total)}</span></div>
    <div class="pp num">${money(total/n)}</div><div class="small muted" style="text-align:center">per person · ${n} diner${n>1?"s":""}</div>`;
}
sheet.addEventListener("input", e => { if(e.target.matches("[data-calc]")) calc(); });
sheet.addEventListener("change", e => { if(e.target.matches("[data-calc]")) calc(); });

      if(id){ ticketOf(t, id).status = "payer"; alertAll(`${first(F(id).name)} is paying the restaurant for ${e2.title}. Fill out your ticket in The Tab and send it over.`, e2.id, id);
        if(id !== st.me) st.alerts.push({id:uid("a"),to:id,text:`You're paying the restaurant for ${e2.title}. Tickets will arrive in your wallet in The Tab.`,eventId:e2.id,t:Date.now(),read:false}); }
      tabView = id === st.me ? "wallet" : "mine"; save(); drawTab(); break; }
    case "tk-cat": tkCat = b.dataset.k; tabEl.querySelectorAll('[data-act="tk-cat"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "tk-add": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me);
      const amt = parseFloat(String(document.getElementById("tk-amt").value).replace(/[^0-9.]/g, ""));
      if(!(amt > 0)){ toast("Enter the price for this line"); return; }
      k.items.push({id:uid("i"), cat:tkCat, desc:document.getElementById("tk-desc").value.trim(), amount:amt});
      document.getElementById("tk-desc").value = ""; document.getElementById("tk-amt").value = ""; save(); drawTab(); toast(`${tkCat} added · ${money(amt)}`); break; }
    case "tk-del": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.items = k.items.filter(x => x.id !== id); save(); drawTab(); break; }
    case "tk-cover": { const t = tabOf(ev(tabId)), k = ticketOf(t, st.me); const other = coveredBy(t, id);
      if(other && other !== st.me && !k.covers.includes(id)){ toast(`${first(dinerName(ev(tabId), id))} is already on ${first(F(other).name)}'s ticket`); return; }
      const i2 = k.covers.indexOf(id); i2 >= 0 ? k.covers.splice(i2, 1) : k.covers.push(id); save(); drawTab(); break; }
    case "tk-cover-guest": { const t = tabOf(ev(tabId)), k = ticketOf(t, st.me); if(!k.covers.includes(id)) k.covers.push(id); save(); drawTab(); toast("Added to your ticket. Add their food under My meal."); break; }
    case "tk-tip": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.tip = +b.dataset.p; save(); drawTab(); break; }
    case "tk-send": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me); k.status = "sent"; k.note = ""; k.sentAt = Date.now();
      st.alerts.push({id:uid("a"),to:t.payer,text:`${first(ME().name)} sent you a ticket for ${money(tmath(t, k).total)}. Verify it in your wallet.`,eventId:e2.id,t:Date.now(),read:false});
      save(); drawTab(); toast(`Ticket sent to ${first(F(t.payer).name)}`); break; }
    case "tk-unsend": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.status = "draft"; save(); drawTab(); break; }
    case "tk-verify": sheetVerify(id); break;
    case "tk-confirm": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "confirmed";
      st.alerts.push({id:uid("a"),to:id,text:`${first(ME().name)} confirmed your ticket: you owe ${money(tmath(t, k).total)}. Pay by Zelle, Apple Pay, Cash App or cash.`,eventId:e2.id,t:Date.now(),read:false});
      save(); closeSheet(); drawTab(); toast(`${first(F(id).name)}'s ticket confirmed`); break; }
    case "tk-return": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "returned"; k.note = document.getElementById("tk-note").value.trim();
      st.alerts.push({id:uid("a"),to:id,text:`${first(ME().name)} sent your ticket back${k.note ? ": " + k.note : " for a correction"}.`,eventId:e2.id,t:Date.now(),read:false});
      save(); closeSheet(); drawTab(); toast(`Sent back to ${first(F(id).name)}`); break; }
    case "tk-pay": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me), amt = tmath(t, k).total, m = b.dataset.m;
      if(b.dataset.h) navigator.clipboard?.writeText(`${b.dataset.h} · ${money(amt)}`).then(() => {}, () => {});
      k.paidVia = m; st.alerts.push({id:uid("a"),to:t.payer,text:`${first(ME().name)} says they paid you ${money(amt)} by ${m}. Mark it settled when it arrives.`,eventId:e2.id,t:Date.now(),read:false});
      save(); drawTab(); toast(m === "Cash" ? `Hand ${first(F(t.payer).name)} ${money(amt)}` : b.dataset.h ? `Copied ${b.dataset.h} and ${money(amt)}` : `Opening ${m}…`); break; }
    case "tk-settle": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "settled"; k.settledAt = Date.now();
      { const m = tmath(t, k);
        st.alerts.push({id:uid("a"),to:id,text:`Receipt · PAID ${money(m.total)} for ${e2.title} at ${RBY[e2.chosen].name}, ${whenPaid(k.settledAt)}${k.paidVia ? ` by ${k.paidVia}` : ""}. Food ${money(m.sub)} · tax ${money(m.tax)} · ${t.autoGrat ? "gratuity incl." : `tip ${money(m.tip)}`}. Balance $0.00. Received by ${lastFirst(ME().name)} — open The Tab to see your receipt.`,eventId:e2.id,t:Date.now(),read:false}); }
      save(); drawTab(); toast(`Receipt sent to ${first(F(id).name)} · $0.00`); break; }
    case "tk-nudge": { const e2 = ev(tabId), t = tabOf(e2); diners(e2).filter(x => x.fam && x.id !== t.payer && !coveredBy(t, x.id) && !["sent","confirmed","settled"].includes(t.tickets[x.id]?.status)).forEach(x => st.alerts.push({id:uid("a"),to:x.id,text:`${first(ME().name)} is waiting on your ticket for ${e2.title}. Open The Tab to fill it out.`,eventId:e2.id,t:Date.now(),read:false})); save(); toast("Reminders sent"); break; }
    case "tab-close-out": { const e2 = ev(tabId), t = tabOf(e2); const total = Object.values(t.tickets).reduce((a2, k) => a2 + tmath(t, k).total, 0); t.closed = true;
      st.ledger = st.ledger.filter(l => l.eventId !== e2.id); st.ledger.push({eventId:e2.id, rid:e2.chosen, date:e2.date, payer:t.payer, mode:"tab", forWhom:null, amount:total});
      alertAll(`The Tab for ${e2.title} is closed. Thanks for settling up!`, e2.id); save(); drawTab(); toast("Tab closed and saved to Who's paid"); break; }
    case "gallery": closeSheet(); openGallery(); break;
    case "gallery-close": closeGallery(); break;
    case "gal-cat": galCat = b.dataset.k; drawGallery(); break;
    case "photo-add": sheetAddPhoto(id || null); break;
    case "ph-cat": photoDraft.cat = b.dataset.k; sheet.querySelectorAll('[data-act="ph-cat"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "ph-save": savePhotos(); break;
    case "block": sheetBlock(b.dataset.rid); break;
    case "block-go": { const rid = b.dataset.rid; st.blocked[rid] = {by:st.me, reason:document.getElementById("bl-reason").value.trim(), date:iso(today0)}; alertAll(`${first(ME().name)} added ${RBY[rid].name} to the Never Again list.`); save(); closeSheet(); render(); toast(`${RBY[rid].name} is on the Never Again list`); break; }
    case "unblock": { const rid = b.dataset.rid; delete st.blocked[rid]; save(); closeSheet(); render(); toast(`${RBY[rid].name} is back in the mix`); break; }
    case "plan-bday": { const f = F(id); newDraft("birthday"); draft.title = `${first(f.name)}'s Birthday`; const fav = radarList().find(x => x.f.id === id)?.favs[0]; if(fav) draft.options = [fav[0]]; go("plan"); break; }
    case "alert-go": closeSheet(); if(id){ const e2 = ev(id); if(e2 && e2.status === "set" && e2.rsvp[st.me] === undefined) openInvite(id); else { go("feed"); setTimeout(() => document.getElementById("ev-"+id)?.scrollIntoView({behavior:"smooth"}), 60); } } break;
    // feed
    case "vote": { const e2 = ev(id); if(e2.status !== "open") return; e2.votes[st.me] = b.dataset.rid; save(); render(); toast(`Voted for ${RBY[b.dataset.rid].name}`); break; }
    case "lock": { const e2 = ev(id); lockEvent(e2).then(ok => { if(ok){ render(); openReveal(id); } }); break; }
    case "rsvp": ev(id).rsvp[st.me] = b.dataset.v; save(); render(); break;
    case "hand": { const g = ev(id).guests.find(x => x.id === b.dataset.g); const i = g.hands.indexOf(st.me); i >= 0 ? g.hands.splice(i,1) : g.hands.push(st.me); save(); render(); if(guestApproved(g)){ toast(`${g.name} is welcome at the table`); alertAll(`The family said yes: ${g.name} is joining ${ev(id).title}.`, id); save(); } break; }
    case "ask-guest": sheetAskGuest(id); break;
    case "ask-guest-go": {
      const e2 = ev(id); const v = document.getElementById("g-name").value.trim(); const em = document.getElementById("g-email").value.trim();
      if(v){ const c = {id:uid("c"), name:v, email:em, phone:"", relation:`Guest of ${ME().name}`}; st.contacts.push(c); guestPick.add(c.id); }
      if(!guestPick.size){ toast("Pick a contact or type a name"); return; }
      guestPick.forEach(cid => { const c = st.contacts.find(x => x.id === cid); e2.guests.push({id:uid("g"),name:c.name,email:c.email||"",contactId:c.id,by:st.me,hands:[st.me]}); alertAll(`${first(ME().name)} asked to bring ${c.name} to ${e2.title}. Raise a hand?`, e2.id); });
      const n = guestPick.size; save(); closeSheet(); render(); toast(`Asked the family about ${n} guest${n>1?"s":""} — hands up!`); break; }
    case "res-claim": { const e2 = ev(id); if(e2.reservation.status !== "none"){ toast(`${F(e2.reservation.by).name} already has it`); return; } e2.reservation = {status:"claimed",by:st.me,conf:""}; alertAll(`${first(ME().name)} is calling ${RBY[e2.chosen].name} to book. No need to call.`, e2.id); save(); render(); toast("Everyone can see you're booking"); break; }
    case "res-release": ev(id).reservation = {status:"none",by:null,conf:""}; save(); render(); break;
    case "res-book": sheetBook(id); break;
    case "res-book-go": { const e2 = ev(id); e2.reservation = {status:"booked",by:st.me,conf:document.getElementById("b-conf").value.trim()}; alertAll(`${first(ME().name)} booked ${RBY[e2.chosen].name} for ${e2.title}.`, e2.id); save(); closeSheet(); render(); toast("Reservation confirmed for the family"); break; }
    case "cancel": if(b.dataset.armed){ st.events = st.events.filter(x => x.id !== id); save(); render(); toast("Plan cancelled"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to cancel"; } break;
    case "concierge": sheetConcierge(id); break;
    case "svc": sheet.dataset.svc = b.dataset.n; sheet.querySelectorAll('[data-act="svc"]').forEach(x => x.setAttribute("aria-pressed", x === b)); calc(); break;
    case "wrap": sheetWrap(id); break;
    case "overall": wrapDraft.overall = +b.dataset.n; sheet.querySelectorAll('[data-act="overall"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "score": wrapDraft.scores[b.dataset.k] = +b.dataset.n; sheet.querySelectorAll(`[data-act="score"][data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", +x.dataset.n <= +b.dataset.n)); break;
    case "pay": wrapDraft.pay = b.dataset.k; sheet.querySelectorAll('[data-act="pay"]').forEach(x => x.setAttribute("aria-pressed", x === b)); document.getElementById("w-for").hidden = b.dataset.k !== "for"; break;
    case "wrap-go": {
      const e2 = ev(wrapDraft.id); const sc = wrapDraft.scores;
      if(!wrapDraft.overall){ toast("Give it a score from 1 to 10"); return; }
      if(Object.values(sc).some(v => !v)){ toast("Rate all six details to save"); return; }
      const text = document.getElementById("w-text").value.trim();
      const amt = parseFloat(document.getElementById("w-amt").value) || 0;
      const moment = document.getElementById("w-note").value.trim();
      const pay = wrapDraft.pay;
      st.reviews.push({id:uid("r"),rid:e2.chosen,by:st.me,date:e2.date,scores:{...sc},overall:wrapDraft.overall,text:text||"(no comment)",status:needsReview(text)?"held":"ok"}); if(needsReview(text)) alertAdmin(`A review from ${first(ME().name)} is waiting for your review.`);
      if(!st.visits.some(v => v.eventId === e2.id)) st.visits.push({rid:e2.chosen,date:e2.date,eventId:e2.id});
      st.ledger = st.ledger.filter(l => l.eventId !== e2.id);
      st.ledger.push({eventId:e2.id,rid:e2.chosen,date:e2.date,payer:pay==="all"||pay==="for"?st.me:null,mode:pay,forWhom:pay==="for"?document.getElementById("w-for").value:null,amount:amt});
      if(moment) st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:e2.id,text:moment});
      e2.status = "done"; save(); closeSheet(); render(); const mineTen = wrapDraft.overall;
      if(mineTen <= 3) setTimeout(() => sheetBlock(e2.chosen, text), 250); else toast("Saved — thanks for the review"); break; }
    case "note": { const inp = document.getElementById("note-"+id); const v = inp.value.trim(); if(!v) return; const held = needsReview(v); st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:id,text:v,status:held?"held":"ok"}); if(held) alertAdmin(`A post from ${first(ME().name)} is waiting for your review.`); save(); render(); if(held) toast(`Held for ${first(F(ADMIN).name)} to review first`); break; }
  }
});
setInterval(() => {
  document.querySelectorAll("[data-cd]").forEach(el => { const e = ev(el.dataset.cd); if(!e || !e.voteEnds) return; const left = e.voteEnds - Date.now(); el.textContent = mmss(left); if(left <= 0 && !liveId && app.hidden === false) render(); });
}, 1000);
tabEl.addEventListener("change", e => { if(!tabId) return; const t = tabOf(ev(tabId));
  if(e.target.id === "tab-auto"){ t.autoGrat = e.target.checked; save(); drawTab(); }
  if(e.target.id === "tab-receipt"){ t.receipt = e.target.value.replace(/[^0-9.]/g,""); save(); drawTab(); } });
document.addEventListener("change", e => {
  if(e.target.id === "g-city"){ gSearch.city = e.target.value; return; }
  const c = e.target.dataset.change; if(!c) return;
  st.ui[c] = e.target.value; save(); render();
});
document.addEventListener("input", e => {
  if(e.target.id === "g-q") gSearch.q = e.target.value;
  if(e.target.dataset.input === "q"){ st.ui.q = e.target.value; save();
    const list = document.getElementById("rlist"); const pos = e.target.selectionStart; view.innerHTML = vExplore(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); }
});
})();
</script>
