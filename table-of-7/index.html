    step(16, "Standing dinners (host)", `${host} opens Host controls, finds <b>🔁 Standing dinners</b>, sets the name, <b>Which</b> (Every, First, Second, Third, Fourth or Last), the <b>Day</b>, the <b>Time</b>, when the <b>Vote opens</b> (2 to 14 days before) and the <b>Vote length</b>, and taps ${pic("Add standing dinner","primary")}. Each one shows when the next dinner is and when its vote opens. At 9 AM that day the vote opens by itself: three choices picked like the Concierge does (Want to Try first; nothing from the last 90 days, the Never Again list, closed places or bakeries), and everyone's bell rings. It can never open twice for the same date. ${pic("Pause")} stops it for now; ${pic("Delete","ghost")} removes it (votes already opened stay).`),
    step(17, "Year at the Table", `From December 1 to January 15, Home shows <b>🎄 Your Year at the Table is ready</b>; any time, tap ${pic("Our Table")} → <b>Year at the Table</b>. It reads only what the family already saved: <b>dinners shared</b> (each wrap-up), the <b>top-scored place</b> (everyone's 1 to 10 that year, averaged), the <b>most visited</b>, the <b>new places tried</b> (first visit ever that year), <b>dishes remembered</b>, and up to six <b>best photos</b> (approved photos from the highest-scored dinners). Tap a year chip to look back at an earlier year.`),
    step(18, "Game Room", `Tap ${pic("Our Table")} → <b>🎲 Game Room</b>, or ${pic("🎲 Play while you wait")} on the dinner card. Each game has its own picture; tap one to see how it's played and how to start. Every game fills the screen; tap ${pic("A+")} at the top right to make it bigger (good for older eyes and little hands) and ${pic("A−")} to go back. <b>Pass &amp; play on this phone:</b> tap ${pic("📱 Pass &amp; play on this phone","primary")} and hand the phone back and forth (it isn't saved and doesn't count). <b>Play the family:</b> tap ${pic("👨‍👩‍👧 Play the family · own phones","wine")}, choose your opponent (and partners, for couple against couple), and tap ${pic("Start Checkers","primary")}. Everyone is notified and plays from their own phone; your side moves first. In Tic-Tac-Toe, tap the colour dots under the board to give X and O your own colours. In Checkers, <b>slide</b> a glowing piece with your finger onto a gold dot (or tap the piece, then the dot): a jump must be taken, you keep jumping while you can, and reaching the far row crowns a king ♛. The game is a draw after 40 moves each with no capture. ${pic("Resign","ghost")} gives the game away; ${pic("Play again","primary")} starts a rematch. Finished family games fill the <b>🏆 Family standings</b>.`),
    step(19, "Trivia Night", `In the Game Room, under <b>🎤 Trivia Night</b>: ${pic("At the table · one phone","primary")} runs the whole game on one phone (name the two teams, then pass the phone or read each question aloud), or ${pic("Family teams · own phones","wine")} lets you put each person on <b>My team</b> or <b>Other team</b>, up to four a team, each answering on their own phone. Pick a category (Music, TV &amp; Movies, Bible, or a mix) and an <b>answer clock</b> (10, 15, 20 or 30 seconds), and tap ${pic("Start Trivia Night","primary")}. The ring counts down and turns red in the last five seconds. If the clock runs out, the same question passes to the other team with a <b>STEAL</b> badge: one chance, their own clock; if that runs out too, the answer shows and the game moves on. The teams take turns: ten questions, one each in turn, four answers to choose from. Tap an answer and the screen shows ✓ or ✗ and the right answer, then the next team's question. The score sits at the top. Family-teams games count toward the 🏆 standings; at-the-table games don't, because one phone can't say who answered. ${pic("End the game","ghost")} stops an at-the-table game; ${pic("Play again","primary")} plays ten new questions.`),
    step(20, "Family Feud", `In the Game Room, under <b>📋 Family Feud</b>, tap ${pic("Start a survey","primary")}. Five questions are filled in for you; change any, tap ${pic("🔀 Different questions")} for new ones, then ${pic("Send the survey to the family","primary")}. Everyone is notified and taps ${pic("Answer the survey","primary")} to answer privately, a few words each; no one, not even the host, sees anyone's answers. When enough people have answered (at least two), the person who started it or the host taps ${pic("Close the survey","wine")}. At the table, one person taps ${pic("Play Family Feud")} and becomes the <b>judge</b>: they put each person on Team 1 or Team 2 and tap ${pic("Start Family Feud","primary")}. The judge's phone shows the family's answers; everyone else sees the hidden board. The team on turn calls out answers: the judge taps ${pic("Reveal","primary")} on a match (its points, one for each person who said it, go into the bank) or ${pic("✗ Strike","wine")}. Three strikes and the other team gets one guess to steal the bank. When the board is cleared or the steal is decided, the round's points go to the winner; the judge taps ${pic("Next round","primary")}. Most points after the last question wins. Similar answers count together when only the spelling differs (“Pizza” and “pizzas”); different words stay separate, and the judge decides at the table whether a guess matches.`),
    step(21, "Spades for couples", `In the Game Room tap ${pic("Deal a game of Spades","wine")}, pick your partner and the other couple, choose 300 or 500 points, and tap ${pic("Deal Spades","primary")}. All four get a notification and play on their own phones; each phone shows only its own cards. <b>Our house rules, Jokers &amp; deuces:</b> 2♣ and 2♥ are out and both jokers are in; the trumps, highest first, are Big Joker, Little Joker, 2♠, 2♦, then A♠ down to 3♠; the 2♦ and the jokers count as spades. <b>Bidding:</b> when it's your turn, tap how many tricks you'll take, or ${pic("Nil","wine")} for none. <b>Play:</b> the cards you may play lift up and glow gold; tap one and it rises with a ${pic("Play","primary")} button, then tap the card again or ${pic("Play","primary")}. Every card stays bright: the ones that don't lift just can't be played right now (follow the suit led if you can, and spades can't be led until one has been played). The trick is laid on the felt in front of each player, and the winning card is outlined in gold. The highest spade wins a trick, or else the highest card of the suit led. <b>Scoring:</b> make your team's bid and score 10 a trick bid plus 1 for each extra trick (a bag); miss it and lose 10 a trick bid. Nil made is +100, nil broken is −100. Every 10 bags cost 100. First couple to the target wins; a couple at −200 loses. ${pic("Resign for our team","ghost")} gives the game to the other couple.`),
    step(22, "Play the computer", `Every game can be played against the computer on your own phone. <b>Tic-Tac-Toe, Connect Four, Checkers:</b> open the game and tap ${pic("Easy")} ${pic("Medium","primary")} or ${pic("Hard","wine")}; you move first, and the computer answers in under a second (Tic-Tac-Toe on Hard never loses). <b>Spades:</b> ${pic("🤖 Me and a computer partner","primary")} deals you and a computer partner against two computers; or in a family game choose <b>🤖 Computer</b> for any seat you can't fill, and the computers bid and play by themselves. <b>Trivia:</b> ${pic("🧠 Just me, against the clock","primary")}: ten questions; when time runs out the answer shows and the next question comes up; your best score is kept. Your record against the computer shows under each game; computer games never count in the 🏆 family standings.`),
    step(23, "Blackjack", `Tap the <b>Blackjack</b> picture. ${pic("🤖 Just me vs the dealer","primary")} plays on your phone; ${pic("👨‍👩‍👧 Family table · own phones","wine")} opens a table for up to four (pick who's playing, then ${pic("Open the table","primary")}). Everyone starts with <b>1,000 points</b>. Tap the chips (10, 25, 50, 100, 500) to build your bet, then ${pic("Bet","primary")}. When everyone has bet, the cards are dealt: the dealer shows one card. On your turn tap ${pic("Hit","primary")} for another card, ${pic("Stand","wine")} to stay, ${pic("Double")} to double your bet for exactly one more card, or ${pic("Split")} to play a pair as two hands. Over 21 is a bust. The dealer then plays, standing on 17; closest to 21 wins. A blackjack (an ace and a ten-card) pays 3 to 2. ${pic("Deal the next hand","primary")} starts the next round; ${pic("Close the table for everyone","ghost")} ends it and lists everyone's final stack, and the biggest stacks show in the Game Room. <b>Chips are points for fun, never money.</b>`),
    step(24, "Game sounds", `At the top of every game, next to ${pic("A+")}, tap ${pic("🔇")} to turn sounds on; it becomes ${pic("🔊")}. Tap again to turn them off. Sounds start off, and your phone remembers your choice.`),
    step(25, "Movie Night", `Tap ${pic("Our Table")} → <b>🎬 Movie Night</b> → ${pic("🍿 Plan a movie night","primary")}. <b>Pick a movie:</b> posters of what's in theaters now, or type any title and tap ${pic("Search","primary")}. Tap a poster for the story, the age rating, the length, the TMDB score, the cast, viewer reviews and ${pic("▶ Watch the trailer","wine")}. Tap ${pic("🍿 Plan a movie night for this","primary")}: choose the date and the showtime you want, tap ${pic("Find theaters","primary")} and pick one, choose who's invited (and, if you like, which dinner it follows), and tap ${pic("🎬 Send the invitation","primary")}. Everyone invited is told. <b>On the night's page:</b> tap ${pic("Going","primary")}, ${pic("Maybe")} or ${pic("Can't go")}. <b>Tickets:</b> one person going taps ${pic("🎟️ I'll buy the tickets","primary")} so nobody buys twice, then ${pic("Fandango","primary")} or ${pic("Theater website")} to buy them there (the app never buys tickets or moves money). Back in the app they fill in how many, the price, the fees, the seats, the auditorium and the confirmation number, and tap ${pic("✓ I bought the tickets","wine")}. <b>Settling up:</b> everyone going sees their share and the buyer's Zelle, Cash App or Apple Pay; pay them yourself, then tap ${pic("I paid by Zelle","primary")} (or how you paid). Or tap ${pic("I'm paying for my own ticket instead")}. The buyer taps ${pic("✓ Received","wine")} when the money arrives, and your <b>🧾 receipt</b> appears: the movie, date and showtime, theater and address, seats, auditorium, confirmation, your share and “Received by” the buyer.`),
    step(26, "Wild Card", `Tap the <b>Wild Card</b> picture. ${pic("vs 1 computer")} ${pic("vs 2 computers","primary")} ${pic("vs 3 computers","wine")} play on your phone; ${pic("👨‍👩‍👧 Family game · own phones","wine")} lets you pick up to three players (or 🤖 Computer) and one round or first to 200, then ${pic("Deal Wild Card","primary")}. On your turn the cards you can play glow: tap one, then tap it again or ${pic("Play it","primary")}. A Wild asks for the new colour. Nothing glows? Tap ${pic("🂠 Draw a card")}; if the new card plays you may play it, or tap ${pic("Pass")}. With two cards left tap ${pic("🔔 Call “Last card!”")} first. If someone forgets, ${pic("🚨 Catch","wine")} appears for everyone else.`),
    step(27, "Bid Whist", `Tap the <b>Bid Whist</b> picture. ${pic("🤖 Me and a computer partner","primary")} plays on your phone; ${pic("👨‍👩‍👧 Deal a family game","wine")} lets you pick your partner and the other couple (🤖 Computer for any seat). <b>Bidding:</b> tap a bid such as ${pic("5 Uptown ⬆","primary")} or ${pic("Pass")}; a higher number beats a lower one, and No Trump beats the same number. If all pass, the dealer must bid. <b>The kitty:</b> the winner gets 6 more cards, taps 6 to put back, then taps a trump suit (or Uptown/Downtown for No Trump). <b>Play:</b> follow suit if you can; the kitty counts as your first book. You need 6 books plus your bid.`),
    step(28, "Dominoes", `Tap the <b>Dominoes</b> picture: ${pic("vs 1 computer")} to ${pic("vs 3 computers","wine")}, or ${pic("👨‍👩‍👧 Family game · own phones","wine")}. Your tiles that fit glow and rise: tap one. If it fits more than one end, tap ${pic("⬅ Left")} ${pic("Right ➡")} ${pic("⬆ Top")} or ${pic("⬇ Bottom")}. The gold bubble shows the open ends' total; a multiple of 5 scores it. Nothing fits? ${pic("🁢 Draw from the boneyard","primary")}. Going out scores everyone else's leftover dots.`),
    step(29, "Memory Match", `Tap the <b>Memory Match</b> picture, choose who's playing (just you, or 2 to 4 passing the phone), then ${pic("Easy · 12 cards")} ${pic("Medium · 16 cards","primary")} or ${pic("Hard · 20 cards","wine")}. Tap two cards. A pair glows green and stays up; a miss flips back and, with players, passes the turn. ${pic("Start over")} deals again.`),
    step(30, "Word Guess", `Tap the <b>Word Guess</b> picture and a category: ${pic("📖 Bible","primary")} ${pic("🎵 Music")} ${pic("🍗 Family & Food","wine")}. Tap letters: right ones turn green and fill in; wrong ones pop a balloon. Six balloons, then the word is shown. ${pic("✍️ Write a word for someone to guess")} hides your word behind dots while you type; tap ${pic("Hide it and start","primary")} and hand the phone over.`),
  ].join("");
  if(k === "voice") return `<div class="card"><b>Table of 7 has no voice commands.</b><p class="small" style="margin:0">Everything is a tap. Skylar and Blake are not connected to this app, and nothing you say is listened to here.</p></div>`;
  if(k === "talk") return [
    step("A", "A Sunday vote", `Jasmine taps ${pic("Start a family vote")}, offers Central BBQ, Gus's and Babalu with a 15-minute vote, and sends it. Everyone's bell rings. Devonte opens it and taps ${pic("Start 15-minute vote","wine")}; the clock starts for all. Rosa and Mario vote; when everyone has voted it closes and every phone shows <b>“The family chose Gus's.”</b>`),
    step("B", "A birthday invitation", `${host} taps ${pic("Send an invitation")}, chooses Birthday and Chez Philippe, adds “Wear red”, and sends. Each person sees a sealed envelope, opens it and taps <b>Accept</b>, <b>Maybe</b> or <b>Decline</b>; ${host} is told each answer.`),
    step("C", "One check at dinner", `Mario taps ${pic("I'll pay the restaurant","primary")}. Rosa adds “Rib plate $21” and “Sweet tea $3.50” and sends her ticket: $24.50, plus 9.75% tax and a 20% tip, is $31.79. Mario sends it back: “You also had the mac and cheese.” Rosa adds it and sends again. Mario confirms; Rosa pays by Zelle and taps Zelle; when it arrives Mario taps ${pic("Send receipt","wine")} and Rosa gets her receipt, <b>Balance $0.00</b>.`),
    step("D", "Running late", `Derrick taps ${pic("Running late")} and picks 15 minutes. Everyone is told “Derrick is running late, about 15 minutes.” At the door he taps ${pic("I've arrived")}.`),
    step("E", "Something sweet after", `Jasmine plans Sunday Dinner at Gus's, taps ${pic("+ Dessert after")} and picks <b>Muddy's Bake Shop</b>. The invitation now reads “and after, dessert at Muddy's Bake Shop” with ${pic("Directions to dessert","primary")}. Everyone's bell rings: “Jasmine added dessert after Sunday Dinner: Muddy's Bake Shop.” After dinner, Mario opens the dinner card and taps ${pic("Directions to dessert","primary")}. Wanting gelato instead, Jasmine taps ${pic("Change","ghost")}, types “gelato” and taps ${pic("Search Google")}, then ${pic("Choose this one","wine")}.`),
    step("F", "Saving a place for later", `Rosa hears about Bavette's in Chicago, opens it in Explore and taps ${pic("☆ Want to try")}. It reads ${pic("★ Want to try · Rosa")} on every phone. Back home, Derrick searches Google for “Ethiopian” and taps ${pic("☆ Want to try")} on a place he likes. On Sunday morning the Home screen's Concierge pick reads <b>“From our Want to Try list — Derrick saved it.”</b>`),
    step("G", "Remembering the dish", `After dinner at Char, Mario taps ${pic("We dined — wrap up","wine")}, gives it 9, and types “Bone-in rib-eye, medium · mac and cheese” under <b>What did you order?</b>. Three months later the family is back at Char; Mario opens ${pic("Open dinner card","primary")} and sees <b>“Last time here, you had Bone-in rib-eye, medium · mac and cheese.”</b> Rosa opens Char's page and sees Mario's 9 with his dish beside it.`),
    step("H", "A question at the table", `Seated at Gus's, Jasmine opens ${pic("Open dinner card","primary")} and reads the <b>Question of the night</b> aloud: “What's a prayer God answered for you, big or small?” Everyone answers in turn. Zoey asks for a lighter one, so Jasmine taps ${pic("Another question","ghost")} and gets “What's the funniest thing that happened to you this week?”.`),
    step("I", "The first Sunday, every month", `${host} adds a standing dinner: “First Sunday Dinner”, First, Sunday, 5:30 PM, vote opens 6 days before. On the Monday before, at 9 AM, every bell rings: <b>“First Sunday Dinner on Sunday, November 1: the family vote is open. Tap to vote.”</b> The ballot already has three places, Acre first because Rosa saved it to Want to Try. Mario adds Char, Devonte taps ${pic("Start 10-minute vote","wine")}, and the family chooses.`),
    step("J", "Looking back in December", `On December 3 Home says <b>Your 2026 Year at the Table is ready</b>. Rosa opens it: 14 dinners shared, top-scored place Char at 9.2, most visited Gus's with 3 visits, 6 new places tried, 11 dishes remembered, and six photos from the best nights. She takes a screenshot to send to the family group.`),
    step("L", "Couples at the checkerboard", `While the food comes, Mario taps ${pic("🎲 Play while you wait")} → ${pic("Checkers","wine")}, picks Rosa as his partner and Jasmine and Devonte as the other couple, and taps ${pic("Start Checkers","primary")}. Jasmine's phone buzzes: “Mario started Checkers with you.” Rosa makes Red's first move; Devonte answers for Black. Jasmine double-jumps and crowns a king ♛. The bell rings on every phone: <b>“Jasmine &amp; Devonte won Checkers (no moves left).”</b> The standings move them to the top.`),
    step("M", "Trivia while the food comes", `Zoey taps ${pic("At the table · one phone","primary")}, names the teams “Kids” and “Grown-ups”, picks <b>TV &amp; Movies</b> and taps ${pic("Start Trivia Night","primary")}. She reads out: “Who played Steve Urkel on Family Matters?” The kids tap <b>Jaleel White</b>: <b>✓ Kids got it</b>. The grown-ups miss the next one and the screen says <b>“✗ It was Chicago.”</b> After ten questions: <b>🏆 Kids won, 6–4.</b> Mario taps ${pic("Play again","primary")} for a rematch.`),
    step("N", "Family Feud at Sunday dinner", `On Tuesday Jasmine taps ${pic("Start a survey","primary")}, keeps “Name something the family always orders when we eat out”, and sends it. Everyone's phone buzzes; by Saturday six have answered, and Jasmine taps ${pic("Close the survey","wine")}. At dinner Richard taps ${pic("Play Family Feud")}, puts the kids on Team 1 and the grown-ups on Team 2, and judges. Team 1 shouts “Wings!” Richard taps ${pic("Reveal","primary")}: <b>Wings · 3</b>, because three of the six said it. Then “Salad?”: ${pic("✗ Strike","wine")}. After three strikes the grown-ups steal with “Catfish” and take the bank.`),
    step("O", "Couples at the card table", `Richard taps ${pic("Deal a game of Spades","wine")}, picks Jasmine as his partner and Mario and Rosa as the other couple, and taps ${pic("Deal Spades","primary")}. Everyone's phone shows their own 13 cards. Richard bids 4, Mario bids Nil, Jasmine 3, Rosa 5. Hearts are led; Jasmine has none and trumps with the 2♦, but Rosa drops the Big Joker and takes it. At the end of the hand the card reads <b>“Richard &amp; Jasmine bid 7, took 8 → +71”</b>. Mario's nil holds: +100 for his couple.`),
    step("P", "Blackjack after dessert", `Devonte taps the <b>Blackjack</b> picture, then ${pic("👨‍👩‍👧 Family table · own phones","wine")}, marks Mario and Candyce as <b>Playing</b> and taps ${pic("Open the table","primary")}. Each taps chips to bet (Mario goes 100, Candyce 25) and taps ${pic("Bet","primary")}. Devonte has 16 against the dealer's 10 and taps ${pic("Hit","primary")}: a 4, twenty. Candyce has a pair of 8s and taps ${pic("Split")}. The dealer stands on 18; Devonte wins 100. After a few hands Devonte taps ${pic("Close the table for everyone","ghost")}, and the Game Room shows the biggest stacks. Later, waiting for the check, Zoey plays ${pic("Hard","wine")} Connect Four against the computer.`),
    step("Q", "Movie night after Sunday dinner", `Jasmine opens ${pic("🎬 Movie Night")} and taps ${pic("🍿 Plan a movie night","primary")}, finds a family movie in theaters now, reads two viewer reviews and watches the trailer. She picks Saturday at 7:30, taps ${pic("Find theaters","primary")}, chooses one in Memphis, marks it “after” the family dinner, and sends it. Mario taps ${pic("Going","primary")} and ${pic("🎟️ I'll buy the tickets","primary")}, buys five seats on Fandango, and fills in F7–F11, the fees and the confirmation number. Nikki pays Mario $14 by Cash App and taps ${pic("I paid by Cash App","primary")}; Mario taps ${pic("✓ Received","wine")} and Nikki's receipt appears. Devonte already has a gift card, so he taps ${pic("I'm paying for my own ticket instead")}.`),
    step("R", "Wild Card at the kids' table", `Zoey taps ${pic("👨‍👩‍👧 Family game · own phones","wine")} under Wild Card, picks Mario and Jasmine, and taps ${pic("Deal Wild Card","primary")}. Mario plays a Blue Skip; Jasmine misses her turn. Zoey is down to two, taps ${pic("🔔 Call “Last card!”")} and plays a Wild: “Red!” Mario has no red and draws. Zoey's last card goes down and the confetti falls: “🏆 Zoey wins!”`),
    step("S", "Bid Whist, the old way", `Richard deals Bid Whist with Jasmine as his partner against Mario and Rosa. Mario passes, Jasmine bids ${pic("4 Uptown ⬆","primary")}, Rosa passes, and Richard, holding both jokers, bids ${pic("5 No Trump ∅","wine")}. He takes the kitty, puts back 6 and taps ${pic("Downtown ⬇")}. They take 12 books: 6 over, doubled for no trump, +12. Seven and out: the game is theirs.`),
    step("T", "Dominoes on the porch", `Mario plays Dominoes against two computers. The 6-6 goes down first, then the 6-4: the ends show <b>16</b>. He sets the 4-3 on the right: <b>15 ✓ scores!</b> The bubble turns gold and he gets 15. Later he goes out first and takes everyone's leftover dots, rounded to 5.`),
    step("U", "Memory Match with Grandma", `Jasmine picks <b>2 players</b> and ${pic("Easy · 12 cards")}. She finds the 🍕 pair and goes again; then misses, and the phone goes to Rosa, who remembers where both 🍰 were. Final: Rosa 4, Jasmine 2. “🏆 Player 2 wins!”`),
    step("V", "A word for Dad", `Zoey taps ${pic("✍️ Write a word for someone to guess")}, types PEACH COBBLER behind the dots and hands the phone to Richard. He tries E, A, then R, and has it with four balloons still floating.`),
    step("K", "Booking the table", `Sunday Dinner is set for Char. Devonte taps ${pic("I'll book it")}; everyone sees “Devonte is calling Char now. Please don't book.” He taps ${pic("📞 Booking options","wine")}, then ${pic("Call (901) …")}, and the phone dials Char. Table for eight at 5:30, confirmation 4471. He taps ${pic("Mark booked","primary")}, types 4471, and the plan shows <b>Reserved · by Devonte · conf 4471 · party of 8</b>.`),
  ].join("");
  if(k === "fix") return [
    ["“We couldn't find … at the table.”", `Type your <b>full name</b> as ${host} set it (Nikki is “Nikki Honorable”). Still stuck? Ask ${host}.`],
    ["“That PIN isn't right. N tries left.”", `Five wrong tries locks your name for 5 minutes on every phone. Forgot it? ${host} can reset it in Host controls; then you make a new one.`],
    ["“Too many wrong PINs from this network.”", "Wait 15 minutes, then try again."],
    ["“Can't reach the table right now.”", "Check Wi-Fi or mobile data and try again."],
    ["“Locked after 10 minutes away.”", "That's on purpose. Sign in again with your PIN."],
    ["“Your seat is paused.”", `You can look but not vote or post. Talk to ${host}.`],
    [`“${host} has taken you off this event.”`, `Only ${host} can put you back on that plan.`],
    ["“Couldn't save that. Showing the table as it is.”", "Someone changed it at the same moment. Look again and redo your tap."],
    ["“Only the host can …”", "That step belongs to the plan's host, the payer, or the table's host. The message says which."],
    ["“That plan was cancelled.”", "Its host cancelled it; the screen closes by itself."],
    ["“Google search is resting until tomorrow / until the 1st.”", "The family used the free Google searches for now. Our own list still works; Google comes back then."],
    ["“Google found nothing like that in …”", "Try another word (a dish, a chain, a cuisine) or a nearby city."],
    ["Notifications don't arrive", "Tap your initial and look at Notifications. On iPhone open Table of 7 from the Home Screen icon, not Safari. If it says blocked, turn notifications on for Table of 7 in the phone's Settings."],
    ["I see an old screen", "Close Table of 7 fully (swipe it away), then open it again from the Home Screen icon. The app never keeps an old copy once it is reopened."],
    ["A bakery isn't in the dinner vote or the Concierge's picks", "That's on purpose: our bakeries and dessert shops are a stop after dinner, not the dinner. Add one with “+ Dessert after” on the plan instead."],
    ["I don't see “+ Dessert after” or “Change” on a plan", `Only that plan's host, or ${host}, can set the dessert stop. Ask them.`],
    ["“… saved it. Only they or … can take it off.”", `A Want to Try star belongs to the person who saved it. Ask them, or ${host}.`],
    ["My Want to Try place isn't the Concierge pick", "The Concierge still skips places resting under the 90-day rule, places on Never Again, and places that don't serve dinner. Everything else on the list comes first."],
    ["“Your seat is paused, so saving places is off for now.”", `A paused seat can look but not save. Talk to ${host}.`],
    ["My dish doesn't show on the restaurant page", "It shows once you've saved the wrap-up with something in “What did you order?”. If your review is held for the host, the dish is held with it."],
    ["“Last time here” isn't on the dinner card", "It appears only when you have wrapped up a dinner at this same restaurant before and filled in what you ordered."],
    ["Our question changed when I tapped “Another question”", "That button changes it on your phone only. Everyone else still sees the dinner's own question; the next dinner gets a fresh one."],
    ["A standing dinner's vote didn't open", "It opens at 9 AM on the day the rule says (the set number of days before the dinner). Check in Host controls that it isn't paused and that “next … vote opens …” shows the date you expect."],
    ["Two votes for the same standing dinner?", "That can't happen: the server claims the date before it opens the vote, so a second try that day does nothing. A vote someone started by hand for the same day is a separate plan; cancel one."],
    ["I don't see Standing dinners", `Only ${host} sets them, in Host controls. Everyone else just gets the vote when it opens.`],
    ["Year at the Table says no dinners", "It counts only dinners someone wrapped up (“We dined — wrap up”). Wrap up past dinners and they appear."],
    ["A photo is missing from Best photos", `Only photos ${host} approved count, up to six, from the year's highest-scored dinners.`],
    ["I don't see “📞 Booking options”", "It appears for the person who tapped “I'll book it”, so two people never call at once. Tap “I'll book it” first."],

const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

async function pushCall(body){
  try { const {data} = await sb.auth.getSession();
    const r = await fetch(SB_URL + "/functions/v1/push", {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + (data.session?.access_token || "")}, body:JSON.stringify(body)});

}
async function pushPanel(){
  const stEl = document.getElementById("push-state"), bEl = document.getElementById("push-btns"); if(!stEl) return;
  const say = (t, btns = "") => { stEl.textContent = t; bEl.innerHTML = btns; };
  if(!pushOK()){
    if(isIOS() && !isStandalone()) return say("On iPhone, notifications work once Table of 7 is on your Home Screen: tap Share (the square with the arrow), then Add to Home Screen. Open Table of 7 from the Home Screen and come back here.");
    return say("This browser can't show notifications. On iPhone, add Table of 7 to your Home Screen first.");
  }
  if(Notification.permission === "denied") return say("Notifications are blocked for Table of 7 on this phone. Turn them on in your phone's Settings, then come back here.");
  const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
  if(sub) say("On. Votes, invitations, check-ins and The Tab reach this phone even when the app is closed.", `<button class="btn sm" data-act="push-test">Send me a test</button><button class="btn sm ghost" data-act="push-off">Turn off</button>`);
  else say("Off. Turn on to hear about votes, invitations, check-ins and The Tab even when the app is closed.", `<button class="btn sm primary" data-act="push-on">Turn on notifications</button>`);
}
async function pushOn(){
  const perm = await Notification.requestPermission();
  if(perm !== "granted"){ toast("Notifications weren't allowed on this phone"); pushPanel(); return; }
  const k = await pushCall({action:"key"});
  if(!k.ok){ toast("Can't reach the table right now. Try again."); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(k.key)});
  const j = sub.toJSON();
  const {error} = await sb.from("push_subscriptions").upsert({member_id:st.me, endpoint:j.endpoint, keys:j.keys, user_agent:navigator.userAgent.slice(0, 200)}, {onConflict:"endpoint"});
  if(error){ await sub.unsubscribe(); toast("Couldn't turn notifications on. Try again."); pushPanel(); return; }
  await pushCall({action:"test"});
  toast("Notifications are on. A test is on its way."); pushPanel();
}
async function pushOff(){
  const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
  if(sub){ await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  toast("Notifications are off on this phone"); pushPanel();
}

async function bookingOptions(e){
  const rid = e.chosen, r = RBY[rid]; if(!r || bookBusy.has(rid)) return;
  bookBusy.add(rid); delete bookInfo[rid]; render();
  try {
    let pid = r.google ? r.placeId : bookPid[rid];
    if(!pid){
      const city = GCITIES.includes(r.city) ? r.city : "Memphis";
      const d = await placesCall({action:"search", q: r.addr ? `${r.name} ${r.addr}` : r.name, city});
      if(!d.ok){ bookInfo[rid] = {err: gWhy(d.code)}; return; }
      const key = whereKey(r.name), open = d.results.filter(x => x.status !== "CLOSED_PERMANENTLY");
      const hit = open.find(x => key.some(w => x.name.toLowerCase().replace(/['’]/g, "").includes(w))) || open[0];
      if(!hit){ bookInfo[rid] = {err: `Google couldn't find ${r.name}. Call them from their own listing.`}; return; }
      pid = bookPid[rid] = hit.placeId;
    }
    const d2 = await placesCall({action:"details", ids:[pid], level:"full"});
    if(!d2.ok || !d2.places[0]){ bookInfo[rid] = {err: gWhy(d2.code)}; return; }
    const p = d2.places[0]; if(r.google) gApply(p, r.city);

}

function calc(){
  const out = document.getElementById("c-out"); if(!out) return;
  const sub = parseFloat(document.getElementById("c-sub").value) || 0;
  const tax = (parseFloat(document.getElementById("c-tax").value) || 0) / 100;
  const n = Math.max(1, parseInt(document.getElementById("c-diners").value) || 1);
  const auto = document.getElementById("c-auto").value === "1";
  const svc = +sheet.dataset.svc;
  const pct = auto ? 0 : TIP_BY_SERVICE[svc];
  const labels = {1:"Poor service → 12%",2:"Below par → 15%",3:"Solid → 18%",4:"Great service → 20%",5:"Exceptional → 22%"};
  document.getElementById("c-svc-note").textContent = auto ? "Gratuity included — add extra only for something special." : labels[svc];
  const t = sub*tax, tip = sub*pct/100, total = sub + t + tip;
  out.innerHTML = `<div class="line"><span>Subtotal</span><span class="num">${money(sub)}</span></div>
    <div class="line"><span>Tax</span><span class="num">${money(t)}</span></div>
    <div class="line"><span>Tip (${pct}%)</span><span class="num">${money(tip)}</span></div>
    <div class="line total"><span>Total</span><span class="num">${money(total)}</span></div>
    <div class="pp num">${money(total/n)}</div><div class="small muted" style="text-align:center">per person · ${n} diner${n>1?"s":""}</div>`;
}
sheet.addEventListener("input", e => { if(e.target.matches("[data-calc]")) calc(); });

    case "host-contact": { const c = st.contacts.find(x => x.id === id); c.banned = !c.banned; save(); drawHost(); toast(c.banned ? `${c.name} can't be invited` : `${c.name} is welcome again`); break; }
    case "card-open": closeSheet(); openCard({eventId: id || null, photoId: b.dataset.pid || null}); break;
    case "card-close": closeCard(); break;
    case "card-photo": cardDraft.photoId = id; cardDraft.upload = null; const ph2 = st.photos.find(x => x.id === id); if(ph2?.rid) cardDraft.rid = ph2.rid; drawCard(); break;
    case "card-style": cardDraft.style = b.dataset.k; drawCard(); break;
    case "card-to": { const i = cardDraft.to.indexOf(id); i >= 0 ? cardDraft.to.splice(i,1) : cardDraft.to.push(id); b.setAttribute("aria-pressed", i < 0); break; }
    case "card-send": sendCard(); break;
    case "card-reopen": { const c = st.cards.find(x => x.id === id); if(c) openCard({card:c}); break; }
    case "tab": closeSheet(); openTab(id || revealId); break;
    case "tab-close": closeTab(); break;
    case "tab-view": tabView = b.dataset.k; drawTab(); tabEl.scrollTop = 0; break;
    case "tab-payer": { const e2 = ev(tabId), t = tabOf(e2); t.payer = id || null;
      if(id){ ticketOf(t, id).status = "payer"; alertAll(`${first(F(id).name)} is paying the restaurant for ${e2.title}. Fill out your ticket in The Tab and send it over.`, e2.id, id);
        if(id !== st.me) st.alerts.push({id:uid("a"),to:id,text:`You're paying the restaurant for ${e2.title}. Tickets will arrive in your wallet in The Tab.`,eventId:e2.id,t:Date.now(),read:false}); }
      tabView = id === st.me ? "wallet" : "mine"; save(); drawTab(); break; }
    case "tk-cat": tkCat = b.dataset.k; tabEl.querySelectorAll('[data-act="tk-cat"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "tk-add": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me);
      const amt = parseFloat(String(document.getElementById("tk-amt").value).replace(/[^0-9.]/g, ""));
      if(!(amt > 0)){ toast("Enter the price for this line"); return; }
      k.items.push({id:uid("i"), cat:tkCat, desc:document.getElementById("tk-desc").value.trim(), amount:amt});
      document.getElementById("tk-desc").value = ""; document.getElementById("tk-amt").value = ""; save(); drawTab(); toast(`${tkCat} added · ${money(amt)}`); break; }
    case "tk-del": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.items = k.items.filter(x => x.id !== id); save(); drawTab(); break; }
    case "tk-cover": { const t = tabOf(ev(tabId)), k = ticketOf(t, st.me); const other = coveredBy(t, id);
      if(other && other !== st.me && !k.covers.includes(id)){ toast(`${first(dinerName(ev(tabId), id))} is already on ${first(F(other).name)}'s ticket`); return; }
      const i2 = k.covers.indexOf(id); i2 >= 0 ? k.covers.splice(i2, 1) : k.covers.push(id); save(); drawTab(); break; }
    case "tk-cover-guest": { const t = tabOf(ev(tabId)), k = ticketOf(t, st.me); if(!k.covers.includes(id)) k.covers.push(id); save(); drawTab(); toast("Added to your ticket. Add their food under My meal."); break; }
    case "tk-tip": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.tip = +b.dataset.p; save(); drawTab(); break; }
    case "tk-send": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me); k.status = "sent"; k.note = ""; k.sentAt = Date.now();
      st.alerts.push({id:uid("a"),to:t.payer,text:`${first(ME().name)} sent you a ticket for ${money(tmath(t, k).total)}. Verify it in your wallet.`,eventId:e2.id,t:Date.now(),read:false});
      save(); drawTab(); toast(`Ticket sent to ${first(F(t.payer).name)}`); break; }
    case "tk-unsend": { const k = ticketOf(tabOf(ev(tabId)), st.me); k.status = "draft"; save(); drawTab(); break; }
    case "tk-verify": sheetVerify(id); break;
    case "tk-confirm": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "confirmed";
      st.alerts.push({id:uid("a"),to:id,text:`${first(ME().name)} confirmed your ticket: you owe ${money(tmath(t, k).total)}. Pay by Zelle, Apple Pay, Cash App or cash.`,eventId:e2.id,t:Date.now(),read:false});
      save(); closeSheet(); drawTab(); toast(`${first(F(id).name)}'s ticket confirmed`); break; }
    case "tk-return": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "returned"; k.note = document.getElementById("tk-note").value.trim();
      st.alerts.push({id:uid("a"),to:id,text:`${first(ME().name)} sent your ticket back${k.note ? ": " + k.note : " for a correction"}.`,eventId:e2.id,t:Date.now(),read:false});
      save(); closeSheet(); drawTab(); toast(`Sent back to ${first(F(id).name)}`); break; }
    case "tk-pay": { const e2 = ev(tabId), t = tabOf(e2), k = ticketOf(t, st.me), amt = tmath(t, k).total, m = b.dataset.m;
      if(b.dataset.h) navigator.clipboard?.writeText(`${b.dataset.h} · ${money(amt)}`).then(() => {}, () => {});
      k.paidVia = m; st.alerts.push({id:uid("a"),to:t.payer,text:`${first(ME().name)} says they paid you ${money(amt)} by ${m}. Mark it settled when it arrives.`,eventId:e2.id,t:Date.now(),read:false});
      save(); drawTab(); toast(m === "Cash" ? `Hand ${first(F(t.payer).name)} ${money(amt)}` : b.dataset.h ? `Copied ${b.dataset.h} and ${money(amt)}` : `Opening ${m}…`); break; }
    case "tk-settle": { const e2 = ev(tabId), t = tabOf(e2), k = t.tickets[id]; k.status = "settled"; k.settledAt = Date.now();
      { const m = tmath(t, k);
        st.alerts.push({id:uid("a"),to:id,text:`Receipt · PAID ${money(m.total)} for ${e2.title} at ${RBY[e2.chosen].name}, ${whenPaid(k.settledAt)}${k.paidVia ? ` by ${k.paidVia}` : ""}. Food ${money(m.sub)} · tax ${money(m.tax)} · ${t.autoGrat ? "gratuity incl." : `tip ${money(m.tip)}`}. Balance $0.00. Received by ${lastFirst(ME().name)} — open The Tab to see your receipt.`,eventId:e2.id,t:Date.now(),read:false}); }
      save(); drawTab(); toast(`Receipt sent to ${first(F(id).name)} · $0.00`); break; }
    case "tk-nudge": { const e2 = ev(tabId), t = tabOf(e2); diners(e2).filter(x => x.fam && x.id !== t.payer && !coveredBy(t, x.id) && !["sent","confirmed","settled"].includes(t.tickets[x.id]?.status)).forEach(x => st.alerts.push({id:uid("a"),to:x.id,text:`${first(ME().name)} is waiting on your ticket for ${e2.title}. Open The Tab to fill it out.`,eventId:e2.id,t:Date.now(),read:false})); save(); toast("Reminders sent"); break; }
    case "tab-close-out": { const e2 = ev(tabId), t = tabOf(e2); const total = Object.values(t.tickets).reduce((a2, k) => a2 + tmath(t, k).total, 0); t.closed = true;
      st.ledger = st.ledger.filter(l => l.eventId !== e2.id); st.ledger.push({eventId:e2.id, rid:e2.chosen, date:e2.date, payer:t.payer, mode:"tab", forWhom:null, amount:total});
      alertAll(`The Tab for ${e2.title} is closed. Thanks for settling up!`, e2.id); save(); drawTab(); toast("Tab closed and saved to Who's paid"); break; }
    case "gallery": closeSheet(); openGallery(); break;
    case "gallery-close": closeGallery(); break;
    case "gal-cat": galCat = b.dataset.k; drawGallery(); break;
    case "photo-add": sheetAddPhoto(id || null); break;
    case "ph-cat": photoDraft.cat = b.dataset.k; sheet.querySelectorAll('[data-act="ph-cat"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "ph-save": savePhotos(); break;
    case "block": sheetBlock(b.dataset.rid); break;
    case "block-go": { const rid = b.dataset.rid; st.blocked[rid] = {by:st.me, reason:document.getElementById("bl-reason").value.trim(), date:iso(today0)}; alertAll(`${first(ME().name)} added ${RBY[rid].name} to the Never Again list.`); save(); closeSheet(); render(); toast(`${RBY[rid].name} is on the Never Again list`); break; }
    case "unblock": { const rid = b.dataset.rid; delete st.blocked[rid]; save(); closeSheet(); render(); toast(`${RBY[rid].name} is back in the mix`); break; }
    case "plan-bday": { const f = F(id); newDraft("birthday"); draft.title = `${first(f.name)}'s Birthday`; const fav = radarList().find(x => x.f.id === id)?.favs[0]; if(fav) draft.options = [fav[0]]; go("plan"); break; }
    case "alert-go": closeSheet(); if(id){ const e2 = ev(id); if(e2 && e2.status === "set" && e2.rsvp[st.me] === undefined) openInvite(id); else { go("feed"); setTimeout(() => document.getElementById("ev-"+id)?.scrollIntoView({behavior:"smooth"}), 60); } } break;
    // feed
    case "vote": { const e2 = ev(id); if(e2.status !== "open") return; e2.votes[st.me] = b.dataset.rid; save(); render(); toast(`Voted for ${RBY[b.dataset.rid].name}`); break; }
    case "lock": { const e2 = ev(id); lockEvent(e2).then(ok => { if(ok){ render(); openReveal(id); } }); break; }
    case "rsvp": ev(id).rsvp[st.me] = b.dataset.v; save(); render(); break;
    case "hand": { const g = ev(id).guests.find(x => x.id === b.dataset.g); const i = g.hands.indexOf(st.me); i >= 0 ? g.hands.splice(i,1) : g.hands.push(st.me); save(); render(); if(guestApproved(g)){ toast(`${g.name} is welcome at the table`); alertAll(`The family said yes: ${g.name} is joining ${ev(id).title}.`, id); save(); } break; }
    case "ask-guest": sheetAskGuest(id); break;
    case "ask-guest-go": {
      const e2 = ev(id); const v = document.getElementById("g-name").value.trim(); const em = document.getElementById("g-email").value.trim();
      if(v){ const c = {id:uid("c"), name:v, email:em, phone:"", relation:`Guest of ${ME().name}`}; st.contacts.push(c); guestPick.add(c.id); }
      if(!guestPick.size){ toast("Pick a contact or type a name"); return; }
      guestPick.forEach(cid => { const c = st.contacts.find(x => x.id === cid); e2.guests.push({id:uid("g"),name:c.name,email:c.email||"",contactId:c.id,by:st.me,hands:[st.me]}); alertAll(`${first(ME().name)} asked to bring ${c.name} to ${e2.title}. Raise a hand?`, e2.id); });
      const n = guestPick.size; save(); closeSheet(); render(); toast(`Asked the family about ${n} guest${n>1?"s":""} — hands up!`); break; }
    case "res-claim": { const e2 = ev(id); if(e2.reservation.status !== "none"){ toast(`${F(e2.reservation.by).name} already has it`); return; } e2.reservation = {status:"claimed",by:st.me,conf:""}; alertAll(`${first(ME().name)} is calling ${RBY[e2.chosen].name} to book. No need to call.`, e2.id); save(); render(); toast("Everyone can see you're booking"); break; }
    case "res-release": ev(id).reservation = {status:"none",by:null,conf:""}; save(); render(); break;
    case "res-book": sheetBook(id); break;
    case "res-book-go": { const e2 = ev(id); e2.reservation = {status:"booked",by:st.me,conf:document.getElementById("b-conf").value.trim()}; alertAll(`${first(ME().name)} booked ${RBY[e2.chosen].name} for ${e2.title}.`, e2.id); save(); closeSheet(); render(); toast("Reservation confirmed for the family"); break; }
    case "cancel": if(b.dataset.armed){ st.events = st.events.filter(x => x.id !== id); save(); render(); toast("Plan cancelled"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to cancel"; } break;
    case "concierge": sheetConcierge(id); break;
    case "svc": sheet.dataset.svc = b.dataset.n; sheet.querySelectorAll('[data-act="svc"]').forEach(x => x.setAttribute("aria-pressed", x === b)); calc(); break;
    case "wrap": sheetWrap(id); break;
    case "overall": wrapDraft.overall = +b.dataset.n; sheet.querySelectorAll('[data-act="overall"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "score": wrapDraft.scores[b.dataset.k] = +b.dataset.n; sheet.querySelectorAll(`[data-act="score"][data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", +x.dataset.n <= +b.dataset.n)); break;
    case "pay": wrapDraft.pay = b.dataset.k; sheet.querySelectorAll('[data-act="pay"]').forEach(x => x.setAttribute("aria-pressed", x === b)); document.getElementById("w-for").hidden = b.dataset.k !== "for"; break;
    case "wrap-go": {
      const e2 = ev(wrapDraft.id); const sc = wrapDraft.scores;
      if(!wrapDraft.overall){ toast("Give it a score from 1 to 10"); return; }
      if(Object.values(sc).some(v => !v)){ toast("Rate all six details to save"); return; }
      const text = document.getElementById("w-text").value.trim();
      const ordered = (document.getElementById("w-ordered")?.value || "").trim().slice(0, 200);
      const amt = parseFloat(document.getElementById("w-amt").value) || 0;
      const moment = document.getElementById("w-note").value.trim();
      const pay = wrapDraft.pay;
      st.reviews.push({id:uid("r"),rid:e2.chosen,by:st.me,date:e2.date,scores:{...sc},overall:wrapDraft.overall,text:text||"(no comment)",ordered,status:needsReview(text + " " + ordered)?"held":"ok"}); if(needsReview(text + " " + ordered)) alertAdmin(`A review from ${first(ME().name)} is waiting for your review.`);
      if(!st.visits.some(v => v.eventId === e2.id)) st.visits.push({rid:e2.chosen,date:e2.date,eventId:e2.id});
      st.ledger = st.ledger.filter(l => l.eventId !== e2.id);
      st.ledger.push({eventId:e2.id,rid:e2.chosen,date:e2.date,payer:pay==="all"||pay==="for"?st.me:null,mode:pay,forWhom:pay==="for"?document.getElementById("w-for").value:null,amount:amt});
      if(moment) st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:e2.id,text:moment});
      e2.status = "done"; save(); closeSheet(); render(); const mineTen = wrapDraft.overall;
      if(mineTen <= 3) setTimeout(() => sheetBlock(e2.chosen, text), 250); else toast("Saved — thanks for the review"); break; }
    case "note": { const inp = document.getElementById("note-"+id); const v = inp.value.trim(); if(!v) return; const held = needsReview(v); st.notes.push({id:uid("n"),by:st.me,date:iso(today0),eventId:id,text:v,status:held?"held":"ok"}); if(held) alertAdmin(`A post from ${first(ME().name)} is waiting for your review.`); save(); render(); if(held) toast(`Held for ${first(F(ADMIN).name)} to review first`); break; }
  }
});
setInterval(() => {
  document.querySelectorAll("[data-cd]").forEach(el => { const e = ev(el.dataset.cd); if(!e || !e.voteEnds) return; const left = e.voteEnds - Date.now(); el.textContent = mmss(left); if(left <= 0 && !liveId && app.hidden === false) render(); });
}, 1000);
tabEl.addEventListener("change", e => { if(!tabId) return; const t = tabOf(ev(tabId));
  if(e.target.id === "tab-auto"){ t.autoGrat = e.target.checked; save(); drawTab(); }
  if(e.target.id === "tab-receipt"){ t.receipt = e.target.value.replace(/[^0-9.]/g,""); save(); drawTab(); } });
document.addEventListener("change", e => {
  if(e.target.id === "g-city"){ gSearch.city = e.target.value; return; }
  const c = e.target.dataset.change; if(!c) return;
  st.ui[c] = e.target.value; save(); render();
});
document.addEventListener("input", e => {
  if(e.target.id === "g-q") gSearch.q = e.target.value;
  if(e.target.dataset.input === "q"){ st.ui.q = e.target.value; save();
    const list = document.getElementById("rlist"); const pos = e.target.selectionStart; view.innerHTML = vExplore(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); }
});
})();
</script>
