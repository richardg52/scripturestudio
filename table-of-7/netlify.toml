# Netlify settings for the Table of 7 site.
# In Netlify, set Base directory = table-of-7 so this file is used
# (and the Scripture Studio settings at the repo root are ignored).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The notification helper must always be fresh, or phones keep an old copy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

# Table of 8 is sold (2026-10-23): the build notes in this folder are for the workshop, never the public.
[[redirects]]
  from = "/HANDOFF.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true
